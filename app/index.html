<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E2B4A" />
<meta name="color-scheme" content="light" />
<title>RD Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1E2B4A;
    --butter: #F5A800;
    --butter-soft: #FFF3D1;
    --milk: #FFFFFF;
    --mist: #EDF1F6;
    --line: #D9E0EA;
    --soft: #5B6780;
    --pause: #8A96AD;
    --leaf: #2F8F5B;
    --danger: #B4442E;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", "Noto Sans Tamil", "Noto Sans Devanagari", "Nirmala UI", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--mist);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- shell ---------- */
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .topbar {
    background: var(--ink);
    color: var(--milk);
    padding: calc(var(--safe-top) + 14px) 20px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .brand span { color: var(--butter); }
  .topbar small { opacity: 0.75; font-size: 14px; }
  main { flex: 1; padding: 18px 16px calc(var(--safe-bottom) + 96px); max-width: 560px; width: 100%; margin: 0 auto; }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--milk);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 8px 8px calc(var(--safe-bottom) + 8px);
    z-index: 20;
  }
  .tabs button {
    flex: 1; padding: 8px 4px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: var(--soft);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button.active { color: var(--ink); }
  .tabs button.active svg { color: var(--butter); }

  h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 26px 4px 12px; letter-spacing: -0.01em; }
  .muted { color: var(--soft); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 20px; border-radius: 14px;
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .btn-main { background: var(--butter); color: var(--ink); }
  .btn-dark { background: var(--ink); color: var(--milk); }
  .btn-line { background: var(--milk); border: 1.5px solid var(--line); color: var(--ink); }
  .btn-quiet { color: var(--soft); font-weight: 600; min-height: 44px; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: 0.5; pointer-events: none; }

  /* ---------- login ---------- */
  .login {
    min-height: 100vh; min-height: 100dvh;
    background: var(--ink); color: var(--milk);
    padding: calc(var(--safe-top) + 48px) 24px calc(var(--safe-bottom) + 32px);
    display: flex; flex-direction: column;
  }
  .login .brand { font-size: 40px; }
  .login .lead { font-size: 18px; opacity: 0.85; margin: 8px 0 40px; max-width: 30ch; }
  .login label { display: block; font-weight: 600; margin-bottom: 8px; }
  .phone-row { display: flex; gap: 10px; }
  .phone-row .cc {
    display: flex; align-items: center; padding: 0 14px;
    border-radius: 14px; background: rgba(255,255,255,0.12); font-weight: 700;
  }
  .login input {
    width: 100%; min-height: 56px; border-radius: 14px; border: 2px solid transparent;
    background: var(--milk); color: var(--ink); padding: 0 16px; font-size: 20px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .login input:focus { outline: none; border-color: var(--butter); }
  .otp-input { text-align: center; letter-spacing: 0.5em !important; font-family: var(--display); font-size: 26px !important; }
  .login .btn { margin-top: 18px; }
  .login .note { margin-top: 16px; font-size: 15px; opacity: 0.8; }
  .login .err { color: #FFC9BC; margin-top: 14px; font-weight: 600; min-height: 1.4em; }
  .login .back { color: var(--butter); margin-top: 10px; font-weight: 600; min-height: 44px; text-align: left; }
  .login .milkline { margin-top: auto; padding-top: 40px; font-size: 14px; opacity: 0.6; }

  /* ---------- tomorrow card (the hero) ---------- */
  .hello { margin: 4px 4px 14px; font-size: 18px; }
  .hello b { font-family: var(--display); font-weight: 700; }
  .tomorrow {
    background: var(--milk); border-radius: 26px; padding: 22px 20px 20px;
    display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center;
  }
  .tomorrow .when { font-weight: 600; color: var(--soft); font-size: 15px; }
  .tomorrow .qty {
    font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1;
    letter-spacing: -0.03em; margin: 6px 0 4px;
  }
  .tomorrow .qty small { font-size: 22px; font-weight: 700; margin-left: 4px; }
  .tomorrow .state { font-weight: 600; font-size: 15px; }
  .state-paused { color: var(--pause); }
  .state-extra { color: #A86F00; }
  .state-less { color: var(--soft); }
  .state-normal { color: var(--leaf); }
  .tomorrow-actions { grid-column: 1 / -1; display: grid; gap: 10px; }
  .lock-note { grid-column: 1 / -1; font-size: 15px; color: var(--soft); background: var(--mist); padding: 12px 14px; border-radius: 14px; }

  .bottle { width: 112px; height: 168px; }
  .bottle .fill { transition: y 0.5s ease, height 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { .bottle .fill { transition: none; } }

  /* stepper */
  .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--mist); border-radius: 16px; padding: 6px; }
  .stepper button {
    width: 52px; height: 52px; border-radius: 12px; background: var(--milk);
    font-size: 26px; font-weight: 700; display: grid; place-items: center;
  }
  .stepper output { font-family: var(--display); font-weight: 700; font-size: 24px; }

  /* week strip */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    background: var(--milk); border-radius: 14px; padding: 10px 2px 10px; text-align: center;
    border: 2px solid transparent;
  }
  .day .dn { font-size: 12px; color: var(--soft); font-weight: 600; }
  .day .dd { font-family: var(--display); font-weight: 700; font-size: 18px; }
  .day .dq { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .day.paused { background: transparent; border: 2px dashed var(--line); }
  .day.paused .dq { color: var(--pause); }
  .day.extra { background: var(--butter-soft); }
  .day.extra .dq { color: #A86F00; }
  .day.locked { opacity: 0.55; }

  .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

  /* ---------- calendar ---------- */
  .cal { background: var(--milk); border-radius: 22px; padding: 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-family: var(--display); font-size: 20px; font-weight: 700; }
  .cal-head button { width: 44px; height: 44px; border-radius: 12px; background: var(--mist); font-size: 20px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .wd { font-size: 12px; font-weight: 600; color: var(--soft); padding: 4px 0; }
  .cd { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; position: relative; }
  .cd .q { font-size: 11px; font-weight: 700; }
  .cd.past { color: var(--pause); }
  .cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cd.paused { border: 2px dashed var(--line); color: var(--pause); }
  .cd.extra { background: var(--butter-soft); }
  .cd.less { background: var(--mist); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--soft); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

  /* ---------- account ---------- */
  .card { background: var(--milk); border-radius: 22px; padding: 6px 18px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--mist); }
  .kv:last-child { border-bottom: 0; }
  .kv span { color: var(--soft); }
  .kv b { text-align: right; font-weight: 600; }
  .pad { padding: 18px; }
  .pending { background: var(--butter-soft); border-radius: 14px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field input[type=date] {
    width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line);
    padding: 0 14px; background: var(--milk);
  }

  /* ---------- bills ---------- */
  .due { background: var(--ink); color: var(--milk); border-radius: 26px; padding: 22px 22px 20px; }
  .due .lbl { opacity: 0.75; font-weight: 600; }
  .due .amt { font-family: var(--display); font-weight: 800; font-size: 48px; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 8px; color: var(--butter); }
  .due .amt.zero { color: var(--milk); }
  .due p { margin: 0; opacity: 0.85; font-size: 15px; }
  .list { background: var(--milk); border-radius: 22px; overflow: hidden; }
  .li { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--mist); text-align: left; }
  .li:last-child { border-bottom: 0; }
  .li .t { font-weight: 700; }
  .li .s { font-size: 14px; color: var(--soft); margin-top: 2px; }
  .li .r { text-align: right; flex-shrink: 0; }
  .li .r b { font-family: var(--display); font-weight: 700; font-size: 18px; }
  .pill { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pill.paid { background: #E3F2EA; color: var(--leaf); }
  .pill.due-p { background: var(--butter-soft); color: #A86F00; }
  .empty { background: var(--milk); border-radius: 22px; padding: 22px 18px; color: var(--soft); }
  .lines { margin: 4px 0 0; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--mist); }
  .line span:first-child { color: var(--soft); }
  .line.total { border-bottom: 0; font-weight: 700; font-size: 18px; }
  .line.total span:first-child { color: var(--ink); }
  .sheet.tall { max-height: 88vh; overflow-y: auto; }
  .sheet h4 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 18px 0 2px; }

  .pill.wait { background: var(--mist); color: var(--soft); }
  .due .wait-note { margin-top: 12px; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
  .upi-box { background: var(--mist); border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .upi-box b { word-break: break-all; }
  .upi-box button { color: var(--ink); font-weight: 700; text-decoration: underline; min-height: 44px; }
  .utr-row { display: flex; gap: 8px; }
  .utr-row input {
    flex: 1; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); padding: 0 14px;
    font-size: 18px; font-weight: 600; letter-spacing: 0.06em; background: var(--milk); min-width: 0;
  }
  .utr-row input:focus { outline: none; border-color: var(--butter); }
  .utr-row button { min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--mist); font-weight: 700; }
  .or { text-align: center; color: var(--soft); font-weight: 600; margin: 14px 0; }
  .attach { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1.5px dashed var(--line); font-weight: 700; cursor: pointer; }
  .attach input { display: none; }
  .proof { display: flex; align-items: center; gap: 12px; background: var(--mist); border-radius: 14px; padding: 10px; }
  .proof img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
  .proof span { flex: 1; font-weight: 600; }
  .proof button { color: var(--danger); font-weight: 700; min-height: 44px; padding: 0 8px; }

  /* ---------- shop ---------- */
  .shop-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 12px; }
  .shop-head h2 { margin: 0; }
  .shop-head button { font-weight: 700; color: var(--ink); background: var(--milk); border-radius: 12px; padding: 10px 14px; min-height: 44px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 12px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: var(--milk); font-weight: 700; font-size: 14px; color: var(--soft); min-height: 40px; }
  .cats button.on { background: var(--ink); color: var(--milk); }
  .prods { display: grid; gap: 12px; }
  .prod { background: var(--milk); border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 92px 1fr; gap: 14px; }
  .prod img { width: 92px; height: 92px; object-fit: contain; border-radius: 16px; background: var(--mist); }
  .prod h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; }
  .prod p { margin: 4px 0 10px; color: var(--soft); font-size: 14px; line-height: 1.35; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sizes button { padding: 7px 12px; border-radius: 10px; background: var(--mist); font-weight: 700; font-size: 14px; min-height: 38px; border: 2px solid transparent; }
  .sizes button.on { border-color: var(--ink); background: var(--milk); }
  .addrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .addrow b { font-family: var(--display); font-size: 20px; }
  .addbtn { background: var(--butter); color: var(--ink); font-weight: 800; border-radius: 12px; padding: 0 18px; min-height: 44px; }
  .mini-step { display: flex; align-items: center; gap: 4px; background: var(--ink); color: var(--milk); border-radius: 12px; }
  .mini-step button { width: 40px; height: 44px; color: var(--milk); font-size: 22px; font-weight: 700; }
  .mini-step span { min-width: 22px; text-align: center; font-weight: 800; }
  .cartbar {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 76px); z-index: 25;
    max-width: 536px; margin: 0 auto; background: var(--ink); color: var(--milk); border-radius: 18px;
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 700;
    box-shadow: 0 10px 30px rgba(30, 43, 74, 0.3);
  }
  .cartbar b { color: var(--butter); }
  body.has-cart main { padding-bottom: calc(var(--safe-bottom) + 170px); }
  .cline { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--mist); }
  .cline .n { font-weight: 700; }
  .cline .z { font-size: 14px; color: var(--soft); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--mist); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--soft); }
  .seg button.on { background: var(--milk); color: var(--ink); box-shadow: 0 1px 4px rgba(30,43,74,0.12); }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 2px solid var(--mist); margin-top: 8px; cursor: pointer; }
  .opt.on { border-color: var(--ink); }
  .opt input { margin-top: 3px; accent-color: #1E2B4A; width: 18px; height: 18px; }
  .opt b { display: block; }
  .opt span { font-size: 14px; color: var(--soft); }
  .sheet select, .sheet textarea {
    width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); padding: 12px 14px; background: var(--milk); font: inherit;
  }
  .sheet textarea { min-height: 76px; resize: vertical; }
  .orow { padding: 14px 0; border-bottom: 1px solid var(--mist); }
  .orow:last-child { border-bottom: 0; }
  .orow .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
  .orow .it { color: var(--soft); font-size: 14px; margin-top: 4px; }
  .done-box { text-align: center; padding: 10px 0 4px; }
  .done-box .tick { width: 64px; height: 64px; border-radius: 50%; background: #E3F2EA; color: var(--leaf); display: grid; place-items: center; margin: 0 auto 12px; font-size: 32px; font-weight: 800; }

  /* ---------- help ---------- */
  .help { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .help a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; font-weight: 700; text-decoration: none; color: var(--ink); background: var(--mist); }
  .help a.wa { background: #25D366; color: #fff; grid-column: 1 / -1; }
  .help svg { width: 20px; height: 20px; }
  .links { display: flex; gap: 18px; justify-content: center; margin-top: 14px; }
  .links a { color: var(--soft); font-weight: 600; font-size: 14px; }
  .danger-link { display: block; margin: 18px auto 0; color: var(--danger); font-weight: 700; min-height: 44px; }
  .reasons { display: grid; gap: 8px; margin: 12px 0 4px; }
  .reasons label { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--mist); font-weight: 600; }
  .reasons input { accent-color: #1E2B4A; width: 18px; height: 18px; }


  /* ---------- languages, sign up, profile, problems ---------- */
  .login-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .langs { display: inline-flex; background: rgba(255,255,255,0.12); border-radius: 12px; padding: 3px; gap: 2px; }
  .langs button { padding: 7px 11px; border-radius: 9px; font-weight: 700; font-size: 14px; color: inherit; opacity: 0.8; min-height: 36px; }
  .langs button.on { background: var(--butter); color: var(--ink); opacity: 1; }
  .card .langs { background: var(--mist); display: flex; }
  .card .langs button { flex: 1; color: var(--ink); }
  .signup { padding-bottom: calc(var(--safe-bottom) + 40px); }
  .su-title { font-family: var(--display); font-size: 30px; margin: 30px 0 4px; letter-spacing: -0.01em; }
  .signup .lead { margin-bottom: 22px; }
  .signup label { margin-top: 14px; }
  .su-input {
    width: 100%; min-height: 52px; border-radius: 14px; border: 2px solid transparent; background: var(--milk);
    color: var(--ink); padding: 0 14px; font-size: 17px; font-weight: 600;
  }
  .su-input:focus { outline: none; border-color: var(--butter); }
  .su-area { min-height: 84px; padding: 12px 14px; resize: vertical; font: inherit; font-weight: 600; }
  select.su-input { appearance: auto; }
  .su-help { font-size: 14px; opacity: 0.75; margin-top: 6px; }
  .su-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  .su-grid > div { min-width: 0; }
  .su-grid .su-input { min-width: 0; max-width: 100%; }
  .su-grid input[type=date] { font-size: 15px; padding: 0 10px; }
  .seg.dark { background: rgba(255,255,255,0.12); }
  .seg.dark button { color: rgba(255,255,255,0.8); }
  .seg.dark button.on { background: var(--butter); color: var(--ink); }
  #su-go { margin-top: 26px; }
  .sec-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 12px; }
  .sec-head h2 { margin: 0; }
  .sec-head button { font-weight: 700; color: var(--ink); background: var(--milk); border-radius: 12px; padding: 10px 16px; min-height: 44px; }
  .sheet input.txt { width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); padding: 0 14px; background: var(--milk); font: inherit; }
  .kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kinds button { min-height: 52px; border-radius: 14px; background: var(--mist); font-weight: 700; padding: 8px 10px; border: 2px solid transparent; text-align: left; }
  .kinds button.on { border-color: var(--ink); background: var(--milk); }
  .empty { background: var(--milk); border-radius: 22px; padding: 22px 18px; color: var(--soft); }


  /* ---------- round 2: logo, colours, selection, help ---------- */
  .brand { display: inline-flex; align-items: center; gap: 8px; }
  .brand .logo { width: 34px; height: 34px; border-radius: 50%; background: #fff; object-fit: contain; padding: 2px; }
  .login .brand .logo { width: 48px; height: 48px; }
  .tabs .ico { position: relative; display: inline-flex; }

  /* ---------- support chat ---------- */
  .chat-card { width: 100%; display: flex; align-items: center; gap: 14px; text-align: left; background: var(--ink); color: var(--milk); border-radius: 22px; padding: 18px; margin-top: 4px; }

  .chat-card b { font-family: var(--display); font-size: 19px; }
  .cc-ico { position: relative; font-size: 30px; width: 54px; height: 54px; border-radius: 16px; background: rgba(255,255,255,0.1); display: grid; place-items: center; flex-shrink: 0; }
  .cc-badge { position: absolute; top: -6px; right: -6px; background: #E0362C; color: #fff; font-style: normal; font-size: 12px; font-weight: 800; min-width: 22px; height: 22px; border-radius: 11px; display: grid; place-items: center; padding: 0 6px; }
  .cc-go { margin-left: auto; font-size: 28px; color: var(--butter); }
  body.in-chat main { padding: 0; max-width: 560px; }
  .chat { display: flex; flex-direction: column; height: calc(100dvh - var(--safe-top) - 64px - 74px - var(--safe-bottom)); background: var(--mist); }
  .chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--milk); border-bottom: 1px solid var(--line); }
  .chat-head button { width: 44px; height: 44px; font-size: 28px; border-radius: 12px; }

  .msg { max-width: 82%; padding: 10px 13px; border-radius: 18px; font-size: 15.5px; line-height: 1.4; position: relative; word-wrap: break-word; }
  .msg.them { align-self: flex-start; background: var(--milk); border-bottom-left-radius: 6px; }
  .msg.bot { border: 1.5px solid var(--butter-soft); }
  .msg.me { align-self: flex-end; background: var(--ink); color: var(--milk); border-bottom-right-radius: 6px; }
  .msg-t { display: block; font-size: 11px; opacity: 0.6; margin-top: 4px; text-align: right; }
  .msg-img { display: block; max-width: 220px; width: 100%; border-radius: 12px; margin-bottom: 6px; cursor: zoom-in; }
  .msg-acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .msg-act { background: var(--butter); color: var(--ink); font-weight: 700; font-size: 14px; border-radius: 10px; padding: 8px 12px; min-height: 40px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 2px 0 6px; }
  .chips button { background: var(--milk); border: 1.5px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 700; font-size: 14px; min-height: 40px; }
  .chips button.on { border-color: var(--ink); background: var(--butter-soft); }
  .chat-note { align-self: center; font-size: 13px; color: var(--soft); background: var(--milk); border-radius: 12px; padding: 8px 12px; text-align: center; }
  .chat-compose { display: flex; align-items: flex-end; gap: 8px; padding: 10px; background: var(--milk); border-top: 1px solid var(--line); }
  .chat-attach { width: 44px; height: 44px; display: grid; place-items: center; font-size: 22px; border-radius: 12px; background: var(--mist); cursor: pointer; flex-shrink: 0; }
  .chat-attach input { display: none; }
  .chat-in { flex: 1; min-width: 0; }
  .chat-in .proof { margin-bottom: 6px; }
  .chat-in textarea { width: 100%; min-height: 44px; max-height: 120px; resize: none; border-radius: 14px; border: 1.5px solid var(--line); padding: 11px 14px; font: inherit; background: var(--mist); }
  .chat-in textarea:focus { outline: none; border-color: var(--butter); background: var(--milk); }
  .chat-send { width: 48px; height: 44px; border-radius: 14px; background: var(--butter); color: var(--ink); font-size: 18px; font-weight: 800; flex-shrink: 0; }


  /* ---------- round 3: profile, map pin, full calendar ---------- */
  .day.sel { background: var(--navy, #1E2B4A) !important; color: #fff !important; border-color: transparent; opacity: 1; }

  .pf-edit { margin-left: auto; background: rgba(255,255,255,0.14); color: #fff; font-weight: 700; border-radius: 12px; padding: 0 16px; min-height: 44px; flex-shrink: 0; }
  .pref-l { font-weight: 700; margin-bottom: 8px; }

  /* ---------- dark theme ---------- */

  html[data-theme="dark"] {
    --ink: #E8ECF4; --milk: #172034; --mist: #0D1321; --line: #2A3652; --soft: #9AA7C2; --pause: #7E8AA6;
    --butter-soft: #3A2F12; --pause-bg: #3A1C1A; --pause-fg: #FF8A80; --extra-bg: #12321F; --extra-fg: #6EE7A0; --less-bg: #152A4A; --less-fg: #8AB8FF;

  /* ---------- opening animation ---------- */
  #splash { position: fixed; inset: 0; z-index: 9999; background: #0C1226; transition: opacity .4s ease, transform .4s ease; }
  #splash svg { width: 100%; height: 100%; display: block; }
  #splash.out { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .sp-hint { position: absolute; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 44px); transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; transition: opacity .6s; }
  .sp-hint.show { opacity: 1; }
  .sp-hint span { color: #fff; font-size: 13px; padding: 6px 14px; border-radius: 999px; background: rgba(14,21,41,.5); white-space: nowrap; font-family: var(--body); }
  .sp-bar { position: relative; width: 110px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.15); overflow: hidden; }
  .sp-bar i { position: absolute; top: 0; bottom: 0; width: 40%; background: #F5A800; border-radius: 2px; animation: spslide 1.4s ease-in-out infinite; }
  @keyframes spslide { from { left: -40%; } to { left: 100%; } }


  /* ---------- loading animations ---------- */
  .rdload { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; min-height: 46vh; padding: 30px 16px; color: #1E2B4A; opacity: 0; animation: ld-in .3s .45s forwards; }
  html[data-theme="dark"] .rdload { color: #E8ECF4; }
  .rdload-art svg { overflow: visible; display: block; }
  .rdload-line { font-size: 15px; font-weight: 600; color: var(--soft); text-align: center; max-width: 30ch; min-height: 22px; transition: opacity .25s; }
  .sheet .rdload { min-height: 220px; }

  .sg { flex: 0 0 132px; background: var(--mist); border-radius: 14px; padding: 10px; display: flex; flex-direction: column; gap: 4px; }
  .sg img { width: 100%; height: 80px; object-fit: contain; background: #fff; border-radius: 10px; }
  .sg-n { font-weight: 700; font-size: 14px; line-height: 1.2; }
  .sg-p { font-size: 12.5px; color: var(--soft); }
  .sg button { margin-top: auto; background: var(--butter); color: #1E2B4A; font-weight: 800; border-radius: 10px; min-height: 36px; }
  .cline2 { display: flex; justify-content: space-between; padding: 6px 0; color: var(--soft); }
  .cline2 .free { color: var(--extra-fg); }
  .minwarn { background: var(--pause-bg); color: var(--pause-fg); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; margin-top: 6px; }
  .freebar { position: relative; background: var(--mist); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; overflow: hidden; margin-top: 6px; }
  .freebar div { position: relative; z-index: 1; }
  .freebar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--extra-bg); }
  .oacts { display: flex; gap: 8px; margin-top: 8px; }
  .oacts button { border: 1.5px solid var(--line); border-radius: 10px; padding: 0 12px; min-height: 38px; font-weight: 700; color: var(--ink); }
  .notice { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--extra-bg); color: var(--extra-fg); border-radius: 16px; padding: 12px 14px; margin-bottom: 10px; }
  .notice b { display: block; }
  .notice span { font-size: 14px; opacity: .85; }
  .notice-acts { display: flex; gap: 4px; flex-shrink: 0; }
  .notice-acts button { font-weight: 800; color: inherit; min-height: 40px; padding: 0 8px; }


  /* ---------- wallet, gold, banners, stories, inbox ---------- */
  .tb-r { display: flex; align-items: center; gap: 10px; }
  .bell { position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 18px; color: #fff; }
  .bell i { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: #E0362C; color: #fff; font-style: normal; font-size: 11px; font-weight: 800; display: grid; place-items: center; border: 2px solid #1E2B4A; }
  .bell i.hidden { display: none; }
  .greet { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 14px; }
  .g-hi { font-family: var(--display); font-weight: 700; font-size: 22px; }
  .g-sub { color: var(--soft); font-size: 14px; margin-top: 2px; }
  .g-ico { font-size: 38px; }
  .billcard { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--butter-soft); border-radius: 16px; padding: 12px 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .billcard b { display: block; } .billcard span { font-size: 14px; color: var(--soft); }
  .bc-acts { display: flex; gap: 6px; }
  .bc-acts button { min-height: 40px; padding: 0 12px; border-radius: 10px; font-weight: 800; border: 1.5px solid var(--ink); color: var(--ink); }
  .bc-acts button.go { background: var(--ink); color: var(--milk); }
  html[data-theme="dark"] .bc-acts button.go { background: var(--butter); color: #1E2B4A; border-color: var(--butter); }
  .stories { display: flex; gap: 12px; overflow-x: auto; padding: 2px 2px 12px; scrollbar-width: none; }
  .stories::-webkit-scrollbar { display: none; }
  .story { flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 4px; width: 70px; }
  .st-ring { width: 66px; height: 66px; border-radius: 50%; padding: 3px; background: conic-gradient(#F5A800, #E0362C, #F5A800); }
  .st-ring img, .st-ring video { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 2px solid var(--mist); }
  .st-t { font-size: 12px; font-weight: 600; max-width: 70px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .storyview { position: fixed; inset: 0; z-index: 80; background: #000; display: flex; align-items: center; justify-content: center; }
  .storyview img, .storyview video { max-width: 100%; max-height: 100%; }
  .sv-bars { position: absolute; top: calc(var(--safe-top) + 10px); left: 10px; right: 10px; display: flex; gap: 4px; z-index: 2; }
  .sv-bars i { flex: 1; height: 3px; background: rgba(255,255,255,.35); border-radius: 2px; overflow: hidden; }
  .sv-bars i.done b, .sv-bars i.now b { display: block; height: 100%; background: #fff; }
  .sv-bars i.now b { width: 0; animation: svfill linear forwards; }
  @keyframes svfill { to { width: 100%; } }
  .sv-x { position: absolute; top: calc(var(--safe-top) + 22px); right: 12px; z-index: 3; color: #fff; font-size: 22px; width: 44px; height: 44px; }
  .sv-cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 18px calc(var(--safe-bottom) + 22px); color: #fff; background: linear-gradient(transparent, rgba(0,0,0,.7)); display: flex; flex-direction: column; gap: 4px; z-index: 2; }
  .sv-prev, .sv-next { position: absolute; top: 0; bottom: 0; width: 35%; z-index: 1; }
  .sv-prev { left: 0; } .sv-next { right: 0; width: 65%; }
  .banners { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 12px; scrollbar-width: none; }
  .banners::-webkit-scrollbar { display: none; }
  .banner { position: relative; flex: 0 0 88%; scroll-snap-align: start; min-height: 128px; border-radius: 20px; overflow: hidden; color: #fff; text-align: left; display: flex; align-items: flex-end; }
  .banner img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .bn-t { position: relative; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; background: linear-gradient(transparent, rgba(0,0,0,.45)); width: 100%; }
  .bn-t b { font-family: var(--display); font-size: 19px; } .bn-t span { font-size: 14px; opacity: .9; }
  .trialcard { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; background: var(--extra-bg); color: var(--extra-fg); border-radius: 18px; padding: 14px 16px; margin-bottom: 12px; }
  .trialcard b { font-family: var(--display); font-size: 18px; } .trialcard i { font-style: normal; font-weight: 800; margin-top: 4px; }
  .wallet { background: linear-gradient(135deg, #2B3D6B, #1E2B4A); color: #fff; border-radius: 22px; padding: 16px 18px; margin-bottom: 14px; }
  .w-top { display: flex; justify-content: space-between; align-items: center; }
  .w-top span { opacity: .75; font-weight: 600; font-size: 14px; } .w-top b { display: block; font-family: var(--display); font-size: 30px; }
  .w-add { background: var(--butter); color: #1E2B4A; font-weight: 800; border-radius: 12px; padding: 0 14px; min-height: 44px; }
  .w-pend { margin-top: 10px; background: rgba(255,255,255,.1); border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
  .w-auto { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: 14px; }
  .w-auto input { width: 20px; height: 20px; accent-color: #F5A800; }
  .w-hist { color: var(--butter); font-weight: 700; margin-top: 8px; min-height: 36px; }
  .chips.amt { margin-bottom: 4px; }
  .coupon { display: flex; gap: 8px; margin-top: 10px; }
  .coupon input { flex: 1; min-width: 0; min-height: 46px; border-radius: 12px; border: 1.5px dashed var(--line); padding: 0 12px; text-transform: uppercase; font-weight: 700; background: var(--milk); color: var(--ink); }
  .coupon button { min-height: 46px; padding: 0 16px; border-radius: 12px; background: var(--mist); font-weight: 800; }
  .goldup { width: 100%; margin-top: 10px; text-align: left; background: #1E2B4A; color: #F5C34A; font-weight: 700; border-radius: 12px; padding: 10px 12px; min-height: 44px; }
  .goldstrip { background: #1E2B4A; color: #F5C34A; font-weight: 700; border-radius: 12px; padding: 10px 12px; margin: 0 2px 12px; }
  .goldhead { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .goldhead span { width: 44px; height: 44px; border-radius: 50%; background: #1E2B4A; color: #F5C34A; display: grid; place-items: center; font-size: 22px; }
  .goldhead h3 { margin: 0; } .goldhead em { font-style: normal; font-weight: 700; color: var(--extra-fg); margin-left: auto; }
  .gold-list { list-style: none; padding: 0; margin: 10px 0; display: grid; gap: 8px; font-weight: 600; }
  .refcode { display: flex; align-items: center; gap: 10px; background: var(--mist); border-radius: 16px; padding: 12px 14px; }
  .refcode span { color: var(--soft); font-size: 14px; } .refcode b { font-family: var(--display); font-size: 24px; letter-spacing: .06em; margin-right: auto; }
  .refcode button { font-weight: 800; text-decoration: underline; min-height: 40px; }
  .refstats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .refstats div { background: var(--mist); border-radius: 14px; padding: 12px; text-align: center; }
  .refstats b { display: block; font-family: var(--display); font-size: 22px; } .refstats span { font-size: 13px; color: var(--soft); }
  .inb { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; margin-bottom: 6px; background: var(--mist); }
  .inb.new { background: var(--butter-soft); }
  .inb span { font-size: 14px; color: var(--soft); } .inb i { font-style: normal; font-size: 12px; color: var(--soft); }
  .pf-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
  .tile { text-align: left; background: var(--milk); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; gap: 2px; min-height: 76px; }
  .tile b { font-size: 15px; } .tile span { font-size: 13px; color: var(--soft); }
  .tile.gold { background: #1E2B4A; color: #F5C34A; } .tile.gold span { color: rgba(255,255,255,.75); }
  .plus { color: var(--extra-fg); }


  /* ---------- round 5: top bar, settings, close button, UPI apps ---------- */
  .tb-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.1); font-size: 17px; }
  .tb-dot { position: absolute; top: 4px; right: 4px; width: 9px; height: 9px; border-radius: 50%; background: #E0362C; }
  .tb-dot.hidden { display: none; }
  .sheet { padding-top: 14px; }
  .sheet-x { position: sticky; top: 0; float: right; margin: -4px -6px 0 8px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; background: var(--mist); color: var(--ink); font-size: 16px; font-weight: 800; }
  .sheet [data-close] { display: none !important; }
  .set-row { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 4px; border-bottom: 1px solid var(--mist); font-weight: 600; color: var(--ink); text-align: left; }

  .switch { position: relative; width: 52px; height: 30px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch i { position: absolute; inset: 0; border-radius: 15px; background: var(--line); transition: .2s; }
  .switch i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: .2s; }
  .switch input:checked + i { background: var(--ink); }
  html[data-theme="dark"] .switch input:checked + i { background: var(--butter); }
  .switch input:checked + i::after { left: 25px; }
  .upi-apps { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .upi-app { display: flex; flex-direction: column; justify-content: center; min-height: 54px; padding: 8px 12px; border-radius: 14px; background: var(--butter); color: #1E2B4A; text-decoration: none; }
  .upi-app b { font-size: 16px; } .upi-app span { font-size: 12.5px; opacity: .8; }
  .upi-app.other { background: var(--mist); color: var(--ink); }
  .feenote { font-size: 13.5px; color: var(--soft); margin-top: 6px; }
  .othumbs { display: flex; gap: 6px; margin-top: 6px; }
  .othumbs img { width: 42px; height: 42px; border-radius: 10px; object-fit: contain; background: #fff; border: 1px solid var(--mist); }
  .ot-one { width: 32px; height: 32px; border-radius: 8px; object-fit: contain; background: #fff; vertical-align: middle; margin-right: 8px; }
  .ot-n { display: flex; align-items: center; }
  .inb-code { font-style: normal; font-weight: 800; color: #B87A00; font-size: 13px; }
  /* keep maps beneath sheets, bars and tabs */
  .mapmini, .mappick { position: relative; isolation: isolate; z-index: 0; }
  .leaflet-container { z-index: 0 !important; }
  .leaflet-pane, .leaflet-top, .leaflet-bottom { z-index: 1 !important; }
  .mappick .pin, .mylocbtn { z-index: 2 !important; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(30, 43, 74, 0.45); z-index: 40; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--milk); border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(var(--safe-bottom) + 20px);
    max-width: 560px; margin: 0 auto;
    transform: translateY(0); transition: transform 0.25s ease;
  }
  .sheet .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
  .sheet h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 4px; }
  .sheet .sub { color: var(--soft); margin: 0 0 16px; }
  .sheet .stack { display: grid; gap: 10px; margin-top: 14px; }

  /* ---------- toast + loading ---------- */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); z-index: 60;
    background: var(--ink); color: var(--milk); border-radius: 14px; padding: 14px 16px;
    font-weight: 600; max-width: 528px; margin: 0 auto;
  }
  .toast.bad { background: var(--danger); }
  .loading { padding: 60px 0; text-align: center; color: var(--soft); }
  .confirm-box { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; background: rgba(30, 43, 74, 0.5); }
  .confirm-box .inner { background: var(--milk); border-radius: 22px; padding: 22px; max-width: 360px; width: 100%; }
  .confirm-box p { margin: 0 0 18px; font-weight: 600; font-size: 17px; }
  .confirm-box .row-actions { margin-top: 0; }
</style>

/* =========================================================
   OPENING ANIMATION: milk crown
   Plays its intro, keeps splashing while the app loads, then hands over.
   ========================================================= */
const SPLASH = (() => {
  const el = document.getElementById("splash");
  if (!el) return { ready() {} };
  const svg = el.querySelector("svg"), hint = document.getElementById("spHint");
  const q = (id) => svg.querySelector("#" + id);
  const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, k) => a + (b - a) * k;
  const INTRO = 1.6, OUTRO = 1.1, P = 1.5, MAX_WAIT = 20;
  const t0 = performance.now();
  let readyAt = null, outroAt = null, raf = 0, done = false;

  function crownCycle(p, strength) {
    let crown = "", ripples = "", drops = "";
    if (p < .32) {
      const y = lerp(-30, 404, Math.pow(p / .32, 2));
      drops += `<ellipse cx="150" cy="${y.toFixed(1)}" rx="9" ry="${(12 + p * 10).toFixed(1)}" fill="url(#cDrop)"/>`;
    } else {
      const k = (p - .32) / .68;
      const h = Math.sin(Math.min(1, k * 1.4) * Math.PI) * 70 * strength;
      const rad = 22 + k * 26, n = 11;
      if (h > 2) {
        let wall = `M${150 - rad} 412 `;
        for (let i = 0; i <= n; i++) { const a = Math.PI + (i / n) * Math.PI; wall += `L${(150 + rad * Math.cos(a)).toFixed(1)} ${(412 - h * (.55 + .1 * Math.sin(i * 1.7)) + 6 * Math.sin(a)).toFixed(1)} `; }
        wall += `L${150 + rad} 412 Q150 426 ${150 - rad} 412 Z`;
        crown += `<path d="${wall}" fill="url(#cTine)" opacity=".96"/>`;
        for (let i = 0; i <= n; i++) {
          const a = Math.PI + (i / n) * Math.PI, x = 150 + rad * Math.cos(a) * 1.04;
          const base = 412 - h * (.55 + .1 * Math.sin(i * 1.7)) + 6 * Math.sin(a);
          const tip = base - h * (.35 + .15 * ((i * 7) % 3) / 2);
          crown += `<path d="M${(x - 3).toFixed(1)} ${base.toFixed(1)} Q${x.toFixed(1)} ${tip.toFixed(1)} ${(x + 3).toFixed(1)} ${base.toFixed(1)} Z" fill="url(#cTine)"/>`;
          if (k > .25 && k < .8) drops += `<circle cx="${(x + (x - 150) * k * .6).toFixed(1)}" cy="${(tip - 10 - (k - .25) * 60 + Math.pow(k * 3, 2) * 6).toFixed(1)}" r="${(2.4 - k * 2).toFixed(1)}" fill="#FFFDF7"/>`;
        }
      }
      for (let r = 0; r < 3; r++) { const rq = k - r * .18; if (rq > 0 && rq < 1) ripples += `<ellipse cx="150" cy="420" rx="${(20 + rq * 120).toFixed(1)}" ry="${(4 + rq * 22).toFixed(1)}" stroke-opacity="${(.5 * (1 - rq)).toFixed(2)}" stroke-width="${(2 - rq).toFixed(1)}"/>`; }
    }
    q("cCrown").innerHTML = crown; q("cRipples").innerHTML = ripples; q("cDrops").innerHTML = drops;
  }

  function finish() {
    if (done) return; done = true;
    cancelAnimationFrame(raf);
    el.classList.add("out");
    setTimeout(() => el.remove(), 450);
  }

  function frame(now) {
    const t = (now - t0) / 1000;
    if (readyAt === null && t > MAX_WAIT) readyAt = t;
    if (readyAt !== null && outroAt === null && t >= INTRO) outroAt = Math.max(t, readyAt);
    const phase = outroAt === null ? (t < INTRO ? "intro" : "loop") : "outro";
    const to = outroAt === null ? 0 : t - outroAt;
    if (phase === "outro") crownCycle(clamp(.32 + to / 1.1 * .68, 0, 1), 1.15); else crownCycle((t % P) / P, 1);
    q("cPoolE").setAttribute("ry", (26 + 1.5 * Math.sin(t * 3)).toFixed(1));
    q("cLogo").setAttribute("opacity", (phase === "outro" ? 1 : clamp((t - 1) / .6, 0, 1)).toFixed(2));
    q("cLogo").setAttribute("transform", `translate(0 ${(6 * Math.sin(t * 1.6)).toFixed(1)})`);
    q("cWord").setAttribute("opacity", clamp((t - 1.2) / .6, 0, 1).toFixed(2));
    hint.classList.toggle("show", phase === "loop" && t > INTRO + 1.4);
    if (phase === "outro" && to > OUTRO) return finish();
    raf = requestAnimationFrame(frame);
  }

  if (reduce) {
    q("cLogo").setAttribute("opacity", 1); q("cWord").setAttribute("opacity", 1);
    return { ready() { setTimeout(finish, 600); } };
  }
  raf = requestAnimationFrame(frame);
  return {
    ready() { if (readyAt === null) readyAt = (performance.now() - t0) / 1000; },
    setHint(text) { const s = document.getElementById("spHintText"); if (s) s.textContent = text; },
  };
})();

/* ---------- storage: phone storage inside the app, browser storage in preview ---------- */
const store = {
  async get(k) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return (await P.get({ key: k })).value;
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k, v) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return P.set({ key: k, value: v });
    try { localStorage.setItem(k, v); } catch {}
  },
  async remove(k) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return P.remove({ key: k });
    try { localStorage.removeItem(k); } catch {}
  },
};

function t(key, vars) {
  let s = (T[LANG] && T[LANG][key]) || key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}

// Current position as a Google Maps link
function getLocationLink() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("no geo"));
    navigator.geolocation.getCurrentPosition(
      (p) => resolve(`https://maps.google.com/?q=${p.coords.latitude.toFixed(6)},${p.coords.longitude.toFixed(6)}`),
      (e) => reject(e),
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 },
    );
  });
}
/* ---------- map pin (Leaflet + OpenStreetMap) ---------- */
let leafletReady = null;
function loadLeaflet() {
  if (window.L) return Promise.resolve();
  if (leafletReady) return leafletReady;
  leafletReady = new Promise((resolve, reject) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";
    document.head.appendChild(css);
    const sc = document.createElement("script");
    sc.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js";
    sc.onload = resolve; sc.onerror = reject;
    document.head.appendChild(sc);
  });
  return leafletReady;
}
const CHENNAI = [13.0827, 80.2707];
function latLngFromLink(link) {
  const m = String(link || "").match(/q=(-?[\d.]+),(-?[\d.]+)/);
  return m ? [Number(m[1]), Number(m[2])] : null;
}
const linkFromLatLng = (lat, lng) => `https://maps.google.com/?q=${lat.toFixed(6)},${lng.toFixed(6)}`;
function tileLayer() {
  return window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" });
}

const d0 = (s) => new Date(s + "T00:00:00Z");
const fmtDay = (s, opts) => d0(s).toLocaleDateString(locale(), { timeZone: "UTC", ...opts });

const addDays = (s, n) => { const d = d0(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };

async function call(fn, body) {
  let res, data, text = "";
  try {
    res = await fetch(`${API}/${fn}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify({ ...body, token: S.token || undefined }),
    });
  } catch {
    return { ok: false, code: "network", message: t("Check your internet connection and try again.") };
  }
  try { text = await res.text(); data = JSON.parse(text); }
  catch {
    console.error(fn, res.status, text);
    return { ok: false, code: "server", message: `${t("RD Dairy server error. Please try again shortly.")} (${res.status})` };
  }
  if (!data || typeof data !== "object") return { ok: false, code: "server", message: t("RD Dairy server error. Please try again shortly.") };
  if (data.ok === undefined && (data.message || data.msg || data.error)) {
    return { ok: false, code: "server", message: `${res.status}: ${data.message || data.msg || data.error}` };
  }
  if (res.status === 401 && fn === "app-api") { await signOutLocal(); return { ok: false, code: "logged_out", message: t("Please log in again.") }; }
  if (data.ok === false) data.message = errMsg(data);
  return data;
}

let toastTimer;
function toast(msg, bad = false) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

function confirmBox(message, yesLabel) {
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "confirm-box";
    box.innerHTML = `<div class="inner"><p>${esc(message)}</p>
      <div class="row-actions"><button class="btn btn-line" data-no>${esc(t("Stay"))}</button>
      <button class="btn btn-dark" data-yes>${esc(yesLabel)}</button></div></div>`;
    document.body.appendChild(box);
    box.addEventListener("click", (e) => {
      if (e.target.closest("[data-yes]")) { box.remove(); resolve(true); }
      else if (e.target.closest("[data-no]") || e.target === box) { box.remove(); resolve(false); }
    });
  });
}

function compressImage(file, maxSide = 1400, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

let lastLoader = -1;
function loaderHTML() {
  let i = Math.floor(Math.random() * LOADERS.length);
  if (i === lastLoader) i = (i + 1) % LOADERS.length;
  lastLoader = i;
  const L = LOADERS[i];
  return `<div class="rdload" role="status" data-ld="${i}" data-step="0"><div class="rdload-art" aria-hidden="true">${L.svg}</div><div class="rdload-line">${esc(t(L.lines[0]))}</div></div>`;
}
setInterval(() => {
  document.querySelectorAll(".rdload").forEach((el) => {
    const L = LOADERS[+el.dataset.ld]; if (!L) return;
    const step = (+el.dataset.step + 1) % L.lines.length; el.dataset.step = step;
    const line = el.querySelector(".rdload-line");
    line.style.opacity = 0;
    setTimeout(() => { line.textContent = t(L.lines[step]); line.style.opacity = 1; }, 250);
  });
}, 2200);

/* ---------- light and dark theme ---------- */
let THEME = "light";
const mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function applyTheme() {
  const dark = THEME === "dark" || (THEME === "system" && mq && mq.matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  const meta = document.querySelector('meta[name="theme-color"]'); if (meta) meta.content = dark ? "#0E1422" : "#1E2B4A";
  window.Capacitor?.Plugins?.StatusBar?.setStyle?.({ style: dark ? "DARK" : "LIGHT" }).catch?.(() => {});
}
mq && mq.addEventListener && mq.addEventListener("change", () => THEME === "system" && applyTheme());
async function setTheme(v) { THEME = v === "dark" ? "dark" : "light"; await store.set("rd_theme", THEME); applyTheme(); }
function themePicker(onChange) {
  const wrap = document.createElement("div");
  wrap.className = "langs";
  const cur = document.documentElement.dataset.theme === "dark" ? "dark" : "light";
  wrap.innerHTML = [["light", "☀️ ", "Light"], ["dark", "🌙 ", "Dark"]]
    .map(([v, ic, l]) => `<button data-theme-set="${v}" class="${cur === v ? "on" : ""}">${ic}${esc(t(l))}</button>`).join("");
  wrap.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-theme-set]"); if (!b) return;
    await setTheme(b.dataset.themeSet); onChange && onChange();
  });
  return wrap;
}

async function setLang(code) {
  LANG = LANGS.some((l) => l.code === code) ? code : "en";
  document.documentElement.lang = LANG;
  await store.set("rd_lang", LANG);
}

function langPicker(onChange) {
  const wrap = document.createElement("div");
  wrap.className = "langs";
  wrap.setAttribute("role", "group");
  wrap.setAttribute("aria-label", "Language");
  wrap.innerHTML = LANGS.map((l) => `<button data-lang="${l.code}" class="${l.code === LANG ? "on" : ""}" lang="${l.code}">${l.label}</button>`).join("");
  wrap.addEventListener("click", async (e) => {
    const b = e.target.closest("[data-lang]");
    if (!b || b.dataset.lang === LANG) return;
    await setLang(b.dataset.lang);
    onChange();
  });
  return wrap;
}

/* ---------- UPI: open the exact app the customer taps ---------- */
function upiAppButtons(link, amountLabel) {
  const q = String(link).split("?")[1] || "";
  const android = /Android/i.test(navigator.userAgent), ios = /iPhone|iPad/i.test(navigator.userAgent);
  const intent = (pkg) => `intent://pay?${q}#Intent;scheme=upi;package=${pkg};end`;
  const apps = android
    ? [["GPay", intent("com.google.android.apps.nbu.paisa.user")], ["PhonePe", intent("com.phonepe.app")], ["Paytm", intent("net.one97.paytm")]]
    : ios
    ? [["GPay", `gpay://upi/pay?${q}`], ["PhonePe", `phonepe://pay?${q}`], ["Paytm", `paytmmp://pay?${q}`]]
    : [];
  return `<div class="upi-apps">
    ${apps.map(([n, href]) => `<a class="upi-app" href="${esc(href)}"><b>${esc(n)}</b><span>${esc(amountLabel || "")}</span></a>`).join("")}
    <a class="upi-app other" href="${esc(link)}"><b>${esc(t(apps.length ? "Other UPI app" : "Pay with UPI app"))}</b><span>${esc(amountLabel || "")}</span></a>
  </div>`;
}

  $("#setLang", sheet).onchange = async (e) => { await setLang(e.target.value); closeSheet(); shell(); go(S.tab || "home"); };

/* ---------- bottle ---------- */
function bottleSVG(qty, usual) {
  const scale = Math.max(usual * 2, 2);
  const ratio = Math.max(0, Math.min(1, qty / scale));
  const bodyBottom = 190, h = (bodyBottom - 58) * ratio;
  return `
  <svg class="bottle" viewBox="0 0 120 200" aria-hidden="true">
    <defs><clipPath id="bclip"><path d="M44 8h32v26c0 8 22 14 22 34v112a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12V68c0-20 22-26 22-34z"/></clipPath></defs>
    <rect x="40" y="0" width="40" height="14" rx="4" fill="${qty > 0 ? "#F5A800" : "#C9D1DE"}"/>
    <g clip-path="url(#bclip)">
      <rect x="0" y="0" width="120" height="200" fill="#FFFFFF"/>
      <rect class="fill" x="0" y="${bodyBottom - h}" width="120" height="${h + 10}" fill="#FFF3D1"/>
      <rect class="fill" x="0" y="${bodyBottom - h}" width="120" height="4" fill="#F5A800" opacity="${qty > 0 ? 0.9 : 0}"/>

    <path d="M44 8h32v26c0 8 22 14 22 34v112a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12V68c0-20 22-26 22-34z"

  </svg>`;
}

/* =========================================================
   LOGIN
   ========================================================= */
function renderLogin(step = "phone", err = "") {
  const app = $("#app");
  if (step === "phone") {
    app.innerHTML = `
      <section class="login">
        <div class="login-top">${brandHTML()}<div id="lp"></div></div>
        <p class="lead">${esc(t("Fresh A2 milk at your door every morning."))}</p>
        <label for="ph">${esc(t("Your mobile number"))}</label>
        <div class="phone-row">
          <div class="cc">+91</div>
          <input id="ph" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" value="${esc(S.phone)}" />
        </div>
        <button class="btn btn-main btn-block" id="send">${esc(t("Send code on WhatsApp"))}</button>
        <div class="err" role="alert">${esc(err)}</div>
        <div class="milkline">${esc(t("Serving Chennai for over 20 years"))}</div>
      </section>`;
    $("#lp").appendChild(langPicker(() => renderLogin("phone")));
    const ph = $("#ph");
    ph.focus();
    ph.addEventListener("input", () => { ph.value = ph.value.replace(/\D/g, "").slice(0, 10); S.phone = ph.value; });
    ph.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#send").click(); });
    $("#send").onclick = async () => {
      const phone = ph.value.replace(/\D/g, "");
      if (phone.length !== 10) return renderLogin("phone", t("Enter your 10 digit mobile number."));
      S.phone = phone;
      $("#send").disabled = true; $("#send").textContent = t("Sending…");
      const r = await call("app-auth", { action: "send_otp", phone });
      if (!r.ok) return renderLogin("phone", r.message);
      renderLogin("otp");
    };
  } else {
    app.innerHTML = `
      <section class="login">
        ${brandHTML()}
        <p class="lead">${esc(t("We sent a 6 digit code to your WhatsApp on +91 {phone}.", { phone: S.phone }))}</p>
        <label for="otp">${esc(t("Code"))}</label>
        <input id="otp" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        <button class="btn btn-main btn-block" id="verify">${esc(t("Log in"))}</button>
        <div class="err" role="alert">${esc(err)}</div>
        <button class="back" id="resend">${esc(t("Send a new code"))}</button>
        <button class="back" id="change">${esc(t("Use a different number"))}</button>
      </section>`;
    const otp = $("#otp");
    otp.focus();
    otp.addEventListener("input", () => {
      otp.value = otp.value.replace(/\D/g, "").slice(0, 6);
      if (otp.value.length === 6) $("#verify").click();
    });
    $("#verify").onclick = async () => {
      if (otp.value.length !== 6) return renderLogin("otp", t("Enter the 6 digit code."));
      $("#verify").disabled = true; $("#verify").textContent = t("Checking…");
      const r = await call("app-auth", { action: "verify_otp", phone: S.phone, code: otp.value, device: deviceType() });
      if (!r.ok) return renderLogin("otp", r.message);
      if (r.new_user) { S.signup = { token: r.signup_token }; return renderSignup(); }
      S.token = r.token;
      await store.set("rd_token", r.token);
      startApp();
    };
    $("#resend").onclick = async () => {
      const r = await call("app-auth", { action: "send_otp", phone: S.phone });
      if (r.ok) toast(t("New code sent on WhatsApp")); else toast(r.message, true);
    };
    $("#change").onclick = () => renderLogin("phone");
  }
}

/* ---------- sheets ---------- */
function openSheet(html) {
  closeSheet();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.innerHTML = `<div class="grip"></div>${html}`;
  scrim.onclick = closeSheet;
  document.body.append(scrim, sheet);
  // A close button at the top corner, kept in place whenever the sheet redraws
  const addX = () => {
    if (sheet.querySelector(":scope > .sheet-x")) return;
    const x = document.createElement("button");
    x.className = "sheet-x"; x.setAttribute("aria-label", t("Close")); x.innerHTML = "✕";
    x.onclick = () => { const c = sheet.querySelector("[data-close]"); if (c) c.click(); else closeSheet(); };
    sheet.prepend(x);
  };
  addX();
  new MutationObserver(addX).observe(sheet, { childList: true });
  return sheet;
}
function closeSheet() { document.querySelectorAll(".scrim,.sheet").forEach((e) => e.remove()); }

async function saveDays(payload, okMsg) {

  await loadHome();
  if (S.tab === "home") renderHome();
  return true;
}

function openDaySheet(date, currentQty, status) {
  const h = S.home;
  const usual = Number(h.default_qty);
  const max = usual + Number(h.max_extra_qty || 5);
  let q = status === "paused" ? usual : Number(currentQty);

  const sheet = openSheet(`
    <h3>${esc(longDate(date))}</h3>
    <p class="sub">${esc(t("Your usual is {qty} a day.", { qty: fmtQty(usual) }))}</p>
    <div class="stepper">
      <button data-minus aria-label="${esc(t("Less milk"))}">−</button>
      <output aria-live="polite">${esc(fmtQty(q))}</output>
      <button data-plus aria-label="${esc(t("More milk"))}">+</button>
    </div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-save>${esc(t("Save {qty} for this day", { qty: fmtQty(q) }))}</button>
      ${status === "paused"
        ? `<button class="btn btn-line btn-block" data-normal>${esc(t("Resume my usual {qty}", { qty: fmtQty(usual) }))}</button>`
        : `<button class="btn btn-line btn-block" data-pause>${esc(t("Pause this day"))}</button>`}
    </div>`);

  const out = $("output", sheet), save = $("[data-save]", sheet);
  const sync = () => { out.textContent = fmtQty(q); save.textContent = t("Save {qty} for this day", { qty: fmtQty(q) }); };
  $("[data-minus]", sheet).onclick = () => { q = Math.max(STEP, +(q - STEP).toFixed(2)); sync(); };
  $("[data-plus]", sheet).onclick = () => { q = Math.min(max, +(q + STEP).toFixed(2)); sync(); };
  save.onclick = () => saveDays({ mode: "qty", qty: q, from: date }, t("{qty} saved for {date}", { qty: fmtQty(q), date: shortDate(date) }));
  $("[data-pause]", sheet)?.addEventListener("click", () => saveDays({ mode: "pause", from: date }, t("Paused for {date}", { date: shortDate(date) })));
  $("[data-normal]", sheet)?.addEventListener("click", () => saveDays({ mode: "normal", from: date }, t("Back to your usual for {date}", { date: shortDate(date) })));
}

function openAwaySheet() {
  const first = S.home.first_editable_date;
  const sheet = openSheet(`
    <h3>${esc(t("Long leave"))}</h3>
    <p class="sub">${esc(t("Choose the days you need no milk. Deliveries restart on their own after the last day."))}</p>
    <div class="field"><label for="af">${esc(t("First day without milk"))}</label><input id="af" type="date" min="${first}" value="${first}" /></div>
    <div class="field"><label for="at">${esc(t("Last day without milk"))}</label><input id="at" type="date" min="${first}" value="${first}" /></div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-go>${esc(t("Pause these days"))}</button>
      <button class="btn btn-quiet btn-block" data-resume>${esc(t("Back early? Resume these days"))}</button>
    </div>`);
  const af = $("#af", sheet), at = $("#at", sheet);
  af.onchange = () => { at.min = af.value; if (at.value < af.value) at.value = af.value; };
  const range = () => {
    if (!af.value || !at.value) { toast(t("Choose both dates"), true); return null; }
    return { from: af.value, to: at.value };
  };
  $("[data-go]", sheet).onclick = () => { const r = range(); if (r) saveDays({ mode: "pause", ...r }, t("Paused from {from} to {to}", { from: shortDate(r.from), to: shortDate(r.to) })); };
  $("[data-resume]", sheet).onclick = () => { const r = range(); if (r) saveDays({ mode: "normal", ...r }, t("Deliveries resume from {from}", { from: shortDate(r.from) })); };
}

/* =========================================================
   DELIVERY CALENDAR (on Home, with multiple day selection)
   ========================================================= */
async function drawHomeCalendar() {
  const box = $("#homecal");
  if (!box) return;
  if (!S.calMonth) S.calMonth = todayIST().slice(0, 7);
  if (!S.cal || S.cal.month !== S.calMonth) {
    const r = await call("app-api", { action: "calendar", month: S.calMonth });
    if (!r.ok) { if (r.code !== "logged_out") toast(r.message, true); return; }
    S.cal = r;
  }
  if (!$("#homecal")) return;

  const h = S.home, c = S.cal, today = todayIST();
  const usual = Number(c.default_qty);
  const map = new Map(c.changes.map((x) => [x.date, x]));
  const first = d0(S.calMonth + "-01");
  const lead = (first.getUTCDay() + 6) % 7; // Monday first
  const days = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  const title = first.toLocaleDateString(locale(), { timeZone: "UTC", month: "long", year: "numeric" });
  const wds = [...Array(7)].map((_, i) => new Date(Date.UTC(2026, 0, 5 + i)).toLocaleDateString(locale(), { timeZone: "UTC", weekday: "narrow" }));

  let cells = wds.map((d) => `<div class="wd">${esc(d)}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += "<div></div>";
  for (let n = 1; n <= days; n++) {
    const date = `${S.calMonth}-${String(n).padStart(2, "0")}`;
    const ch = map.get(date);
    let cls = "", q = usual;
    if (ch) { q = ch.qty; cls = ch.paused ? "paused" : q > usual ? "extra" : q < usual ? "less" : ""; }
    if (date < h.first_editable_date) cls += " past";
    if (date === today) cls += " today";
    if (S.sel.has(date)) cls += " sel";
    const label = ch?.paused ? t("Paused") : fmtQty(q);
    cells += `<button class="cd ${cls}" data-date="${date}" aria-pressed="${S.sel.has(date)}" aria-label="${esc(longDate(date))}, ${esc(label)}">
      ${n}<span class="q">${ch?.paused ? "✕" : esc(+Number(q).toFixed(2))}</span></button>`;
  }

  box.innerHTML = `
    <div class="cal">
      <div class="cal-head">
        <button data-m="-1" aria-label="${esc(t("Previous month"))}">‹</button>
        <b>${esc(title)}</b>
        <button data-m="1" aria-label="${esc(t("Next month"))}">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        <span><i class="lg-usual"></i>${esc(t("Usual {qty}", { qty: fmtQty(usual) }))}</span>
        <span><i class="lg-extra"></i>${esc(t("Extra"))}</span>
        <span><i class="lg-less"></i>${esc(t("Less"))}</span>
        <span><i class="lg-paused"></i>${esc(t("Paused"))}</span>
        <span><i class="lg-sel"></i>${esc(t("Selected"))}</span>
      </div>
    </div>`;

  box.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => {
    const d = d0(S.calMonth + "-01");
    d.setUTCMonth(d.getUTCMonth() + Number(b.dataset.m));
    S.calMonth = d.toISOString().slice(0, 7);
    drawHomeCalendar();
  });
  box.querySelectorAll("[data-date]").forEach((b) => b.onclick = () => {
    const date = b.dataset.date;
    if (date < h.first_editable_date) return toast(t("Changes for {date} are closed.", { date: shortDate(date) }));
    if (S.sel.has(date)) S.sel.delete(date); else S.sel.add(date);
    drawHomeCalendar();
    updateSelBar();
  });
  updateSelBar();
}

function updateSelBar() {
  document.querySelector(".selbar")?.remove();
  document.body.classList.remove("has-sel");
  if (!S.token || S.tab !== "home" || !S.sel.size) return;
  document.body.classList.add("has-sel");
  const n = S.sel.size;
  const bar = document.createElement("div");
  bar.className = "selbar";
  bar.innerHTML = `<span>${esc(n === 1 ? t("1 day selected") : t("{n} days selected", { n }))}</span>
    <div><button data-clear>${esc(t("Clear"))}</button><button data-change class="go">${esc(t("Change"))}</button></div>`;
  bar.querySelector("[data-clear]").onclick = () => { S.sel.clear(); updateSelBar(); if ($("#homecal")) drawHomeCalendar(); else renderHome(); };
  bar.querySelector("[data-change]").onclick = () => {
    const dates = [...S.sel].sort();
    if (dates.length === 1) {
      const ch = S.cal?.changes.find((x) => x.date === dates[0]);
      return openDaySheet(dates[0], ch ? ch.qty : S.home.default_qty, ch ? (ch.paused ? "paused" : "changed") : "normal");
    }
    openMultiSheet(dates);
  };
  document.body.appendChild(bar);
}

function openMultiSheet(dates) {
  const h = S.home;
  const usual = Number(h.default_qty);
  const max = usual + Number(h.max_extra_qty || 5);
  let q = usual;
  const n = dates.length;
  const sheet = openSheet(`
    <h3>${esc(t("Change {n} days", { n }))}</h3>
    <p class="sub">${esc(dates.map((d) => fmtDay(d, { day: "numeric", month: "short" })).join(", "))}</p>
    <div class="stepper">
      <button data-minus aria-label="${esc(t("Less milk"))}">−</button>
      <output aria-live="polite">${esc(fmtQty(q))}</output>
      <button data-plus aria-label="${esc(t("More milk"))}">+</button>
    </div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-save>${esc(t("Save {qty} for these days", { qty: fmtQty(q) }))}</button>
      <button class="btn btn-line btn-block" data-pause>${esc(t("Pause these days"))}</button>
      <button class="btn btn-quiet btn-block" data-normal>${esc(t("Back to usual for these days"))}</button>
    </div>`);
  const out = $("output", sheet), save = $("[data-save]", sheet);
  const sync = () => { out.textContent = fmtQty(q); save.textContent = t("Save {qty} for these days", { qty: fmtQty(q) }); };
  $("[data-minus]", sheet).onclick = () => { q = Math.max(STEP, +(q - STEP).toFixed(2)); sync(); };
  $("[data-plus]", sheet).onclick = () => { q = Math.min(max, +(q + STEP).toFixed(2)); sync(); };
  save.onclick = () => saveDays({ mode: "qty", qty: q, dates }, t("Saved for {n} days", { n }));
  $("[data-pause]", sheet).onclick = () => saveDays({ mode: "pause", dates }, t("Paused {n} days", { n }));
  $("[data-normal]", sheet).onclick = () => saveDays({ mode: "normal", dates }, t("Back to usual for {n} days", { n }));
}
