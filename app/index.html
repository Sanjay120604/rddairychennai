<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1E2B4A" />
<meta name="color-scheme" content="light" />
<title>RD Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --ink: #1E2B4A;
    --butter: #F5A800;
    --butter-soft: #FFF3D1;
    --milk: #FFFFFF;
    --mist: #EDF1F6;
    --line: #D9E0EA;
    --soft: #5B6780;
    --pause: #8A96AD;
    --leaf: #2F8F5B;
    --danger: #B4442E;
    --display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
    --body: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--body);
    color: var(--ink);
    background: var(--mist);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  :focus-visible { outline: 3px solid var(--butter); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- shell ---------- */
  #app { min-height: 100%; display: flex; flex-direction: column; }
  .topbar {
    background: var(--ink);
    color: var(--milk);
    padding: calc(var(--safe-top) + 14px) 20px 16px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
  .brand span { color: var(--butter); }
  .topbar small { opacity: 0.75; font-size: 14px; }
  main { flex: 1; padding: 18px 16px calc(var(--safe-bottom) + 96px); max-width: 560px; width: 100%; margin: 0 auto; }

  .tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    background: var(--milk);
    border-top: 1px solid var(--line);
    display: flex; justify-content: space-around;
    padding: 8px 8px calc(var(--safe-bottom) + 8px);
    z-index: 20;
  }
  .tabs button {
    flex: 1; padding: 8px 4px; border-radius: 12px;
    font-size: 13px; font-weight: 600; color: var(--soft);
    display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .tabs button svg { width: 24px; height: 24px; }
  .tabs button.active { color: var(--ink); }
  .tabs button.active svg { color: var(--butter); }

  h2 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 26px 4px 12px; letter-spacing: -0.01em; }
  .muted { color: var(--soft); }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 50px; padding: 0 20px; border-radius: 14px;
    font-weight: 700; font-size: 16px; text-decoration: none;
  }
  .btn-main { background: var(--butter); color: var(--ink); }
  .btn-dark { background: var(--ink); color: var(--milk); }
  .btn-line { background: var(--milk); border: 1.5px solid var(--line); color: var(--ink); }
  .btn-quiet { color: var(--soft); font-weight: 600; min-height: 44px; }
  .btn-block { width: 100%; }
  .btn[disabled] { opacity: 0.5; pointer-events: none; }

  /* ---------- login ---------- */
  .login {
    min-height: 100vh; min-height: 100dvh;
    background: var(--ink); color: var(--milk);
    padding: calc(var(--safe-top) + 48px) 24px calc(var(--safe-bottom) + 32px);
    display: flex; flex-direction: column;
  }
  .login .brand { font-size: 40px; }
  .login .lead { font-size: 18px; opacity: 0.85; margin: 8px 0 40px; max-width: 30ch; }
  .login label { display: block; font-weight: 600; margin-bottom: 8px; }
  .phone-row { display: flex; gap: 10px; }
  .phone-row .cc {
    display: flex; align-items: center; padding: 0 14px;
    border-radius: 14px; background: rgba(255,255,255,0.12); font-weight: 700;
  }
  .login input {
    width: 100%; min-height: 56px; border-radius: 14px; border: 2px solid transparent;
    background: var(--milk); color: var(--ink); padding: 0 16px; font-size: 20px; font-weight: 600;
    letter-spacing: 0.04em;
  }
  .login input:focus { outline: none; border-color: var(--butter); }
  .otp-input { text-align: center; letter-spacing: 0.5em !important; font-family: var(--display); font-size: 26px !important; }
  .login .btn { margin-top: 18px; }
  .login .note { margin-top: 16px; font-size: 15px; opacity: 0.8; }
  .login .err { color: #FFC9BC; margin-top: 14px; font-weight: 600; min-height: 1.4em; }
  .login .back { color: var(--butter); margin-top: 10px; font-weight: 600; min-height: 44px; text-align: left; }
  .login .milkline { margin-top: auto; padding-top: 40px; font-size: 14px; opacity: 0.6; }

  /* ---------- tomorrow card (the hero) ---------- */
  .hello { margin: 4px 4px 14px; font-size: 18px; }
  .hello b { font-family: var(--display); font-weight: 700; }
  .tomorrow {
    background: var(--milk); border-radius: 26px; padding: 22px 20px 20px;
    display: grid; grid-template-columns: 112px 1fr; gap: 18px; align-items: center;
  }
  .tomorrow .when { font-weight: 600; color: var(--soft); font-size: 15px; }
  .tomorrow .qty {
    font-family: var(--display); font-weight: 800; font-size: 54px; line-height: 1;
    letter-spacing: -0.03em; margin: 6px 0 4px;
  }
  .tomorrow .qty small { font-size: 22px; font-weight: 700; margin-left: 4px; }
  .tomorrow .state { font-weight: 600; font-size: 15px; }
  .state-paused { color: var(--pause); }
  .state-extra { color: #A86F00; }
  .state-less { color: var(--soft); }
  .state-normal { color: var(--leaf); }
  .tomorrow-actions { grid-column: 1 / -1; display: grid; gap: 10px; }
  .lock-note { grid-column: 1 / -1; font-size: 15px; color: var(--soft); background: var(--mist); padding: 12px 14px; border-radius: 14px; }

  .bottle { width: 112px; height: 168px; }
  .bottle .fill { transition: y 0.5s ease, height 0.5s ease; }
  @media (prefers-reduced-motion: reduce) { .bottle .fill { transition: none; } }

  /* stepper */
  .stepper { display: flex; align-items: center; justify-content: space-between; background: var(--mist); border-radius: 16px; padding: 6px; }
  .stepper button {
    width: 52px; height: 52px; border-radius: 12px; background: var(--milk);
    font-size: 26px; font-weight: 700; display: grid; place-items: center;
  }
  .stepper output { font-family: var(--display); font-weight: 700; font-size: 24px; }

  /* week strip */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day {
    background: var(--milk); border-radius: 14px; padding: 10px 2px 10px; text-align: center;
    border: 2px solid transparent;
  }
  .day .dn { font-size: 12px; color: var(--soft); font-weight: 600; }
  .day .dd { font-family: var(--display); font-weight: 700; font-size: 18px; }
  .day .dq { font-size: 12px; font-weight: 700; margin-top: 2px; }
  .day.paused { background: transparent; border: 2px dashed var(--line); }
  .day.paused .dq { color: var(--pause); }
  .day.extra { background: var(--butter-soft); }
  .day.extra .dq { color: #A86F00; }
  .day.locked { opacity: 0.55; }

  .row-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }

  /* ---------- calendar ---------- */
  .cal { background: var(--milk); border-radius: 22px; padding: 16px; }
  .cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .cal-head b { font-family: var(--display); font-size: 20px; font-weight: 700; }
  .cal-head button { width: 44px; height: 44px; border-radius: 12px; background: var(--mist); font-size: 20px; font-weight: 700; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal-grid .wd { font-size: 12px; font-weight: 600; color: var(--soft); padding: 4px 0; }
  .cd { aspect-ratio: 1; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-weight: 600; position: relative; }
  .cd .q { font-size: 11px; font-weight: 700; }
  .cd.past { color: var(--pause); }
  .cd.today { box-shadow: inset 0 0 0 2px var(--ink); }
  .cd.paused { border: 2px dashed var(--line); color: var(--pause); }
  .cd.extra { background: var(--butter-soft); }
  .cd.less { background: var(--mist); }
  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 14px; font-size: 13px; color: var(--soft); }
  .legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

  /* ---------- account ---------- */
  .card { background: var(--milk); border-radius: 22px; padding: 6px 18px; }
  .kv { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--mist); }
  .kv:last-child { border-bottom: 0; }
  .kv span { color: var(--soft); }
  .kv b { text-align: right; font-weight: 600; }
  .pad { padding: 18px; }
  .pending { background: var(--butter-soft); border-radius: 14px; padding: 12px 14px; font-weight: 600; margin-bottom: 12px; }
  .field { margin-top: 14px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; }
  .field input[type=date] {
    width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line);
    padding: 0 14px; background: var(--milk);
  }

  /* ---------- bills ---------- */
  .due { background: var(--ink); color: var(--milk); border-radius: 26px; padding: 22px 22px 20px; }
  .due .lbl { opacity: 0.75; font-weight: 600; }
  .due .amt { font-family: var(--display); font-weight: 800; font-size: 48px; letter-spacing: -0.03em; line-height: 1.05; margin: 6px 0 8px; color: var(--butter); }
  .due .amt.zero { color: var(--milk); }
  .due p { margin: 0; opacity: 0.85; font-size: 15px; }
  .list { background: var(--milk); border-radius: 22px; overflow: hidden; }
  .li { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--mist); text-align: left; }
  .li:last-child { border-bottom: 0; }
  .li .t { font-weight: 700; }
  .li .s { font-size: 14px; color: var(--soft); margin-top: 2px; }
  .li .r { text-align: right; flex-shrink: 0; }
  .li .r b { font-family: var(--display); font-weight: 700; font-size: 18px; }
  .pill { display: inline-block; margin-top: 4px; font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; }
  .pill.paid { background: #E3F2EA; color: var(--leaf); }
  .pill.due-p { background: var(--butter-soft); color: #A86F00; }
  .empty { background: var(--milk); border-radius: 22px; padding: 22px 18px; color: var(--soft); }
  .lines { margin: 4px 0 0; }
  .line { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--mist); }
  .line span:first-child { color: var(--soft); }
  .line.total { border-bottom: 0; font-weight: 700; font-size: 18px; }
  .line.total span:first-child { color: var(--ink); }
  .sheet.tall { max-height: 88vh; overflow-y: auto; }
  .sheet h4 { font-family: var(--display); font-weight: 700; font-size: 17px; margin: 18px 0 2px; }

  .pill.wait { background: var(--mist); color: var(--soft); }
  .due .wait-note { margin-top: 12px; background: rgba(255,255,255,0.1); border-radius: 12px; padding: 10px 12px; font-weight: 600; }
  .upi-box { background: var(--mist); border-radius: 16px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; }
  .upi-box b { word-break: break-all; }
  .upi-box button { color: var(--ink); font-weight: 700; text-decoration: underline; min-height: 44px; }
  .utr-row { display: flex; gap: 8px; }
  .utr-row input {
    flex: 1; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); padding: 0 14px;
    font-size: 18px; font-weight: 600; letter-spacing: 0.06em; background: var(--milk); min-width: 0;
  }
  .utr-row input:focus { outline: none; border-color: var(--butter); }
  .utr-row button { min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--mist); font-weight: 700; }
  .or { text-align: center; color: var(--soft); font-weight: 600; margin: 14px 0; }
  .attach { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; border: 1.5px dashed var(--line); font-weight: 700; cursor: pointer; }
  .attach input { display: none; }
  .proof { display: flex; align-items: center; gap: 12px; background: var(--mist); border-radius: 14px; padding: 10px; }
  .proof img { width: 56px; height: 56px; object-fit: cover; border-radius: 10px; }
  .proof span { flex: 1; font-weight: 600; }
  .proof button { color: var(--danger); font-weight: 700; min-height: 44px; padding: 0 8px; }

  /* ---------- shop ---------- */
  .shop-head { display: flex; align-items: center; justify-content: space-between; margin: 6px 4px 12px; }
  .shop-head h2 { margin: 0; }
  .shop-head button { font-weight: 700; color: var(--ink); background: var(--milk); border-radius: 12px; padding: 10px 14px; min-height: 44px; }
  .cats { display: flex; gap: 8px; overflow-x: auto; padding: 0 2px 12px; scrollbar-width: none; }
  .cats::-webkit-scrollbar { display: none; }
  .cats button { flex-shrink: 0; padding: 9px 16px; border-radius: 999px; background: var(--milk); font-weight: 700; font-size: 14px; color: var(--soft); min-height: 40px; }
  .cats button.on { background: var(--ink); color: var(--milk); }
  .prods { display: grid; gap: 12px; }
  .prod { background: var(--milk); border-radius: 22px; padding: 14px; display: grid; grid-template-columns: 92px 1fr; gap: 14px; }
  .prod img { width: 92px; height: 92px; object-fit: contain; border-radius: 16px; background: var(--mist); }
  .prod h3 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 18px; line-height: 1.2; }
  .prod p { margin: 4px 0 10px; color: var(--soft); font-size: 14px; line-height: 1.35; }
  .sizes { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sizes button { padding: 7px 12px; border-radius: 10px; background: var(--mist); font-weight: 700; font-size: 14px; min-height: 38px; border: 2px solid transparent; }
  .sizes button.on { border-color: var(--ink); background: var(--milk); }
  .addrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .addrow b { font-family: var(--display); font-size: 20px; }
  .addbtn { background: var(--butter); color: var(--ink); font-weight: 800; border-radius: 12px; padding: 0 18px; min-height: 44px; }
  .mini-step { display: flex; align-items: center; gap: 4px; background: var(--ink); color: var(--milk); border-radius: 12px; }
  .mini-step button { width: 40px; height: 44px; color: var(--milk); font-size: 22px; font-weight: 700; }
  .mini-step span { min-width: 22px; text-align: center; font-weight: 800; }
  .cartbar {
    position: fixed; left: 12px; right: 12px; bottom: calc(var(--safe-bottom) + 76px); z-index: 25;
    max-width: 536px; margin: 0 auto; background: var(--ink); color: var(--milk); border-radius: 18px;
    padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; font-weight: 700;
    box-shadow: 0 10px 30px rgba(30, 43, 74, 0.3);
  }
  .cartbar b { color: var(--butter); }
  body.has-cart main { padding-bottom: calc(var(--safe-bottom) + 170px); }
  .cline { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--mist); }
  .cline .n { font-weight: 700; }
  .cline .z { font-size: 14px; color: var(--soft); }
  .seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--mist); border-radius: 14px; padding: 4px; gap: 4px; }
  .seg button { min-height: 44px; border-radius: 11px; font-weight: 700; color: var(--soft); }
  .seg button.on { background: var(--milk); color: var(--ink); box-shadow: 0 1px 4px rgba(30,43,74,0.12); }
  .opt { display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 16px; border: 2px solid var(--mist); margin-top: 8px; cursor: pointer; }
  .opt.on { border-color: var(--ink); }
  .opt input { margin-top: 3px; accent-color: #1E2B4A; width: 18px; height: 18px; }
  .opt b { display: block; }
  .opt span { font-size: 14px; color: var(--soft); }
  .sheet select, .sheet textarea {
    width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); padding: 12px 14px; background: var(--milk); font: inherit;
  }
  .sheet textarea { min-height: 76px; resize: vertical; }
  .orow { padding: 14px 0; border-bottom: 1px solid var(--mist); }
  .orow:last-child { border-bottom: 0; }
  .orow .top { display: flex; justify-content: space-between; gap: 10px; font-weight: 700; }
  .orow .it { color: var(--soft); font-size: 14px; margin-top: 4px; }
  .done-box { text-align: center; padding: 10px 0 4px; }
  .done-box .tick { width: 64px; height: 64px; border-radius: 50%; background: #E3F2EA; color: var(--leaf); display: grid; place-items: center; margin: 0 auto 12px; font-size: 32px; font-weight: 800; }

  /* ---------- help ---------- */
  .help { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .help a { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; border-radius: 14px; font-weight: 700; text-decoration: none; color: var(--ink); background: var(--mist); }
  .help a.wa { background: #25D366; color: #fff; grid-column: 1 / -1; }
  .help svg { width: 20px; height: 20px; }
  .links { display: flex; gap: 18px; justify-content: center; margin-top: 14px; }
  .links a { color: var(--soft); font-weight: 600; font-size: 14px; }
  .danger-link { display: block; margin: 18px auto 0; color: var(--danger); font-weight: 700; min-height: 44px; }
  .reasons { display: grid; gap: 8px; margin: 12px 0 4px; }
  .reasons label { display: flex; gap: 10px; align-items: center; padding: 12px 14px; border-radius: 14px; background: var(--mist); font-weight: 600; }
  .reasons input { accent-color: #1E2B4A; width: 18px; height: 18px; }

  /* ---------- sheet ---------- */
  .scrim { position: fixed; inset: 0; background: rgba(30, 43, 74, 0.45); z-index: 40; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: var(--milk); border-radius: 26px 26px 0 0;
    padding: 10px 20px calc(var(--safe-bottom) + 20px);
    max-width: 560px; margin: 0 auto;
    transform: translateY(0); transition: transform 0.25s ease;
  }
  .sheet .grip { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 16px; }
  .sheet h3 { font-family: var(--display); font-weight: 700; font-size: 22px; margin: 0 0 4px; }
  .sheet .sub { color: var(--soft); margin: 0 0 16px; }
  .sheet .stack { display: grid; gap: 10px; margin-top: 14px; }

  /* ---------- toast + loading ---------- */
  .toast {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 92px); z-index: 60;
    background: var(--ink); color: var(--milk); border-radius: 14px; padding: 14px 16px;
    font-weight: 600; max-width: 528px; margin: 0 auto;
  }
  .toast.bad { background: var(--danger); }
  .loading { padding: 60px 0; text-align: center; color: var(--soft); }
  .confirm-box { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; padding: 24px; background: rgba(30, 43, 74, 0.5); }
  .confirm-box .inner { background: var(--milk); border-radius: 22px; padding: 22px; max-width: 360px; width: 100%; }
  .confirm-box p { margin: 0 0 18px; font-weight: 600; font-size: 17px; }
  .confirm-box .row-actions { margin-top: 0; }
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =========================================================
   SETTINGS: paste your Supabase Project URL here (one time)
   ========================================================= */
const SUPABASE_URL = "https://zfdfsewzcwufhsyhqvnn.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_MRgQiOb1LZf0rYynRXpDAg_gK4dMJF2";

const API = SUPABASE_URL.trim().replace(/\/(rest|functions)\/v1.*$/, "").replace(/\/+$/, "") + "/functions/v1";
const STEP = 0.5;

/* ---------- storage: phone storage inside the app, browser storage in preview ---------- */
const store = {
  async get(k) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return (await P.get({ key: k })).value;
    try { return localStorage.getItem(k); } catch { return null; }
  },
  async set(k, v) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return P.set({ key: k, value: v });
    try { localStorage.setItem(k, v); } catch {}
  },
  async remove(k) {
    const P = window.Capacitor?.Plugins?.Preferences;
    if (P) return P.remove({ key: k });
    try { localStorage.removeItem(k); } catch {}
  },
};

/* ---------- state ---------- */
const S = { token: null, tab: "home", home: null, calMonth: null, cal: null, phone: "" };

/* ---------- helpers ---------- */
const $ = (sel, el = document) => el.querySelector(sel);
const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const fmtQty = (q) => {
  q = Number(q || 0);
  if (q === 0) return "None";
  if (q < 1) return `${Math.round(q * 1000)} ml`;
  return `${+q.toFixed(2)} L`;
};
const shortQty = (q) => `${+Number(q || 0).toFixed(2)} L`;
const qtyParts = (q) => {
  q = Number(q || 0);
  if (q === 0) return { n: "0", u: "L" };
  if (q < 1) return { n: String(Math.round(q * 1000)), u: "ml" };
  return { n: String(+q.toFixed(2)), u: "L" };
};
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 0, maximumFractionDigits: 2 });
const modeLabel = (m) => {
  m = String(m || "").trim();
  const known = { upi: "UPI", gpay: "GPay", phonepe: "PhonePe", paytm: "Paytm", cash: "Cash", bank: "Bank transfer", neft: "NEFT", imps: "IMPS", card: "Card", razorpay: "Online", online: "Online", cheque: "Cheque" };
  return known[m.toLowerCase()] || (m ? m.charAt(0).toUpperCase() + m.slice(1) : "Payment");
};
const d0 = (s) => new Date(s + "T00:00:00Z");
const fmtDay = (s, opts) => d0(s).toLocaleDateString("en-IN", { timeZone: "UTC", ...opts });
const longDate = (s) => fmtDay(s, { weekday: "long", day: "numeric", month: "long" });
const shortDate = (s) => fmtDay(s, { weekday: "short", day: "numeric", month: "short" });
const addDays = (s, n) => { const d = d0(s); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); };
const periodLabel = (a, b) => {
  if (!a) return "Bill";
  if (b && a.slice(0, 7) === b.slice(0, 7) && a.endsWith("-01")) return fmtDay(a, { month: "long", year: "numeric" });
  return `${fmtDay(a, { day: "numeric", month: "short" })} to ${fmtDay(b || a, { day: "numeric", month: "short", year: "numeric" })}`;
};
const todayIST = () => new Date(Date.now() + 5.5 * 3600 * 1000).toISOString().slice(0, 10);
const cutoffLabel = (t) => {
  const [h, m] = String(t || "21:00").split(":").map(Number);
  const hh = ((h + 11) % 12) + 1;
  return `${hh}${m ? ":" + String(m).padStart(2, "0") : ""} ${h < 12 ? "AM" : "PM"}`;
};

async function call(fn, body) {
  let res, data, text = "";
  try {
    res = await fetch(`${API}/${fn}`, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
      body: JSON.stringify({ ...body, token: S.token || undefined }),
    });
  } catch {
    return { ok: false, code: "network", message: "Check your internet connection and try again." };
  }
  try { text = await res.text(); data = JSON.parse(text); }
  catch {
    console.error(fn, res.status, text);
    return { ok: false, code: "server", message: `RD Dairy server error (${res.status}). Please try again shortly.` };
  }
  if (!data || typeof data !== "object") return { ok: false, code: "server", message: "RD Dairy server error. Please try again shortly." };
  if (data.ok === undefined && (data.message || data.msg || data.error)) {
    return { ok: false, code: "server", message: `${res.status}: ${data.message || data.msg || data.error}` };
  }
  if (res.status === 401 && fn === "app-api") { await signOutLocal(); return { ok: false, code: "logged_out", message: "Please log in again." }; }
  return data;
}

let toastTimer;
function toast(msg, bad = false) {
  document.querySelector(".toast")?.remove();
  const el = document.createElement("div");
  el.className = "toast" + (bad ? " bad" : "");
  el.setAttribute("role", "status");
  el.textContent = msg;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 3200);
}

function confirmBox(message, yesLabel) {
  return new Promise((resolve) => {
    const box = document.createElement("div");
    box.className = "confirm-box";
    box.innerHTML = `<div class="inner"><p>${esc(message)}</p>
      <div class="row-actions"><button class="btn btn-line" data-no>Stay</button>
      <button class="btn btn-dark" data-yes>${esc(yesLabel)}</button></div></div>`;
    document.body.appendChild(box);
    box.addEventListener("click", (e) => {
      if (e.target.closest("[data-yes]")) { box.remove(); resolve(true); }
      else if (e.target.closest("[data-no]") || e.target === box) { box.remove(); resolve(false); }
    });
  });
}

/* ---------- bottle ---------- */
function bottleSVG(qty, usual) {
  const scale = Math.max(usual * 2, 2);
  const ratio = Math.max(0, Math.min(1, qty / scale));
  const bodyTop = 58, bodyBottom = 190, h = (bodyBottom - bodyTop) * ratio;
  return `
  <svg class="bottle" viewBox="0 0 120 200" aria-hidden="true">
    <defs><clipPath id="bclip"><path d="M44 8h32v26c0 8 22 14 22 34v112a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12V68c0-20 22-26 22-34z"/></clipPath></defs>
    <rect x="40" y="0" width="40" height="14" rx="4" fill="${qty > 0 ? "#F5A800" : "#C9D1DE"}"/>
    <g clip-path="url(#bclip)">
      <rect x="0" y="0" width="120" height="200" fill="#FFFFFF"/>
      <rect class="fill" x="0" y="${bodyBottom - h}" width="120" height="${h + 10}" fill="#FFF3D1"/>
      <rect class="fill" x="0" y="${bodyBottom - h}" width="120" height="4" fill="#F5A800" opacity="${qty > 0 ? 0.9 : 0}"/>
    </g>
    <path d="M44 8h32v26c0 8 22 14 22 34v112a12 12 0 0 1-12 12H34a12 12 0 0 1-12-12V68c0-20 22-26 22-34z"
      fill="none" stroke="#1E2B4A" stroke-width="3"/>
    <text x="60" y="132" text-anchor="middle" font-family="Bricolage Grotesque, sans-serif" font-weight="800" font-size="20" fill="#1E2B4A" opacity="0.18">A2</text>
  </svg>`;
}

function renderLogin(step = "phone", err = "") {
  const app = $("#app");
  if (step === "phone") {
    app.innerHTML = `
      <section class="login">
        <div class="brand">RD <span>Dairy</span></div>
        <p class="lead">Fresh A2 milk at your door every morning.</p>
        <label for="ph">Your mobile number</label>
        <div class="phone-row">
          <div class="cc">+91</div>
          <input id="ph" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="10" value="${esc(S.phone)}" />
        </div>
        <button class="btn btn-main btn-block" id="send">Send code on WhatsApp</button>
        <div class="err" role="alert">${esc(err)}</div>
        <div class="milkline">Serving Chennai for over 20 years</div>
      </section>`;
    const ph = $("#ph");
    ph.focus();
    ph.addEventListener("input", () => { ph.value = ph.value.replace(/\D/g, "").slice(0, 10); });
    ph.addEventListener("keydown", (e) => { if (e.key === "Enter") $("#send").click(); });
    $("#send").onclick = async () => {
      const phone = ph.value.replace(/\D/g, "");
      if (phone.length !== 10) return renderLogin("phone", "Enter your 10 digit mobile number.");
      S.phone = phone;
      $("#send").disabled = true; $("#send").textContent = "Sending…";
      const r = await call("app-auth", { action: "send_otp", phone });
      if (!r.ok) return renderLogin("phone", r.message);
      renderLogin("otp");
    };
  } else {
    app.innerHTML = `
      <section class="login">
        <div class="brand">RD <span>Dairy</span></div>
        <p class="lead">We sent a 6 digit code to your WhatsApp on +91 ${esc(S.phone)}.</p>
        <label for="otp">Code</label>
        <input id="otp" class="otp-input" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" />
        <button class="btn btn-main btn-block" id="verify">Log in</button>
        <div class="err" role="alert">${esc(err)}</div>
        <button class="back" id="resend">Send a new code</button>
        <button class="back" id="change">Use a different number</button>
      </section>`;
    const otp = $("#otp");
    otp.focus();
    otp.addEventListener("input", () => {
      otp.value = otp.value.replace(/\D/g, "").slice(0, 6);
      if (otp.value.length === 6) $("#verify").click();
    });
    $("#verify").onclick = async () => {
      if (otp.value.length !== 6) return renderLogin("otp", "Enter the 6 digit code.");
      $("#verify").disabled = true; $("#verify").textContent = "Checking…";
      const device = /iPhone|iPad/i.test(navigator.userAgent) ? "ios" : /Android/i.test(navigator.userAgent) ? "android" : "web";
      const r = await call("app-auth", { action: "verify_otp", phone: S.phone, code: otp.value, device });
      if (!r.ok) return renderLogin("otp", r.message);
      S.token = r.token;
      await store.set("rd_token", r.token);
      startApp();
    };
    $("#resend").onclick = async () => {
      const r = await call("app-auth", { action: "send_otp", phone: S.phone });
      if (r.ok) toast("New code sent on WhatsApp"); else toast(r.message, true);
    };
    $("#change").onclick = () => renderLogin("phone");
  }
}

  SH.catalog = null; SH.cart = []; store.remove("rd_cart"); document.querySelector(".cartbar")?.remove();

}

async function loadHome() {
  const r = await call("app-api", { action: "home" });
  if (!r.ok) { if (r.code !== "logged_out") toast(r.message, true); return null; }
  S.home = r;
  const ta = $("#tb-area"); if (ta) ta.textContent = r.area || "";
  return r;
}

  if (S.tab !== "home") return;

        <p style="margin:0 0 6px;font-weight:700;font-size:18px">Your number is registered with RD Dairy.</p>

      ` : `

      `}
    </section>

    <h2>Next 7 days</h2>
    <div class="week">
      ${h.next7.map((d) => {
        const locked = d.date < h.first_editable_date;
        return `<button class="day ${d.status} ${locked ? "locked" : ""}" data-edit="${d.date}" ${locked ? 'aria-disabled="true"' : ""}

/* ---------- sheets ---------- */
function openSheet(html) {
  closeSheet();
  const scrim = document.createElement("div");
  scrim.className = "scrim";
  const sheet = document.createElement("div");
  sheet.className = "sheet";
  sheet.setAttribute("role", "dialog");
  sheet.setAttribute("aria-modal", "true");
  sheet.innerHTML = `<div class="grip"></div>${html}`;
  scrim.onclick = closeSheet;
  document.body.append(scrim, sheet);
  return sheet;
}
function closeSheet() { document.querySelectorAll(".scrim,.sheet").forEach((e) => e.remove()); }

async function saveDays(payload, okMsg) {
  const r = await call("app-api", { action: "set_days", ...payload });
  if (!r.ok) { toast(r.message, true); return false; }
  closeSheet();
  toast(okMsg);
  S.home = null; S.cal = null;
  await loadHome();
  if (S.tab === "home") renderHome();
  if (S.tab === "calendar") renderCalendar();
  return true;
}

function openDaySheet(date, currentQty, status) {
  const h = S.home;
  const usual = Number(h.default_qty);
  const max = usual + Number(h.max_extra_qty || 5);
  let q = status === "paused" ? usual : Number(currentQty);

  const sheet = openSheet(`
    <h3>${esc(longDate(date))}</h3>
    <p class="sub">Your usual is ${esc(fmtQty(usual))} a day.</p>
    <div class="stepper">
      <button data-minus aria-label="Less milk">−</button>
      <output aria-live="polite">${esc(fmtQty(q))}</output>
      <button data-plus aria-label="More milk">+</button>
    </div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-save>Save ${esc(fmtQty(q))} for this day</button>
      ${status === "paused"
        ? `<button class="btn btn-line btn-block" data-normal>Resume my usual ${esc(fmtQty(usual))}</button>`
        : `<button class="btn btn-line btn-block" data-pause>Pause this day</button>`}
    </div>`);

  const out = $("output", sheet), save = $("[data-save]", sheet);
  const sync = () => { out.textContent = fmtQty(q); save.textContent = `Save ${fmtQty(q)} for this day`; };
  $("[data-minus]", sheet).onclick = () => { q = Math.max(STEP, +(q - STEP).toFixed(2)); sync(); };
  $("[data-plus]", sheet).onclick = () => { q = Math.min(max, +(q + STEP).toFixed(2)); sync(); };
  save.onclick = () => saveDays({ mode: "qty", qty: q, from: date }, `${fmtQty(q)} saved for ${shortDate(date)}`);
  $("[data-pause]", sheet)?.addEventListener("click", () => saveDays({ mode: "pause", from: date }, `Paused for ${shortDate(date)}`));
  $("[data-normal]", sheet)?.addEventListener("click", () => saveDays({ mode: "normal", from: date }, `Back to your usual for ${shortDate(date)}`));
}

function openAwaySheet() {
  const h = S.home;
  const first = h.first_editable_date;
  const sheet = openSheet(`
    <h3>Going away?</h3>
    <p class="sub">Choose the days you need no milk. Deliveries restart on their own after the last day.</p>
    <div class="field"><label for="af">First day without milk</label><input id="af" type="date" min="${first}" value="${first}" /></div>
    <div class="field"><label for="at">Last day without milk</label><input id="at" type="date" min="${first}" value="${first}" /></div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-go>Pause these days</button>
      <button class="btn btn-quiet btn-block" data-resume>Back early? Resume these days</button>
    </div>`);
  const af = $("#af", sheet), at = $("#at", sheet);
  af.onchange = () => { at.min = af.value; if (at.value < af.value) at.value = af.value; };
  const range = () => {
    if (!af.value || !at.value) { toast("Choose both dates", true); return null; }
    return { from: af.value, to: at.value };
  };
  $("[data-go]", sheet).onclick = () => { const r = range(); if (r) saveDays({ mode: "pause", ...r }, `Paused from ${shortDate(r.from)} to ${shortDate(r.to)}`); };
  $("[data-resume]", sheet).onclick = () => { const r = range(); if (r) saveDays({ mode: "normal", ...r }, `Deliveries resume from ${shortDate(r.from)}`); };
}

/* =========================================================
   CALENDAR
   ========================================================= */
async function renderCalendar() {
  const v = $("#view");
  if (!S.home) { v.innerHTML = `<div class="loading">Loading…</div>`; if (!(await loadHome())) return; }
  if (!S.home.is_subscriber) { v.innerHTML = `<div class="card pad">Your delivery calendar appears here once your subscription starts.</div>`; return; }
  if (!S.calMonth) S.calMonth = todayIST().slice(0, 7);
  if (!S.cal || S.cal.month !== S.calMonth) {
    v.innerHTML = `<div class="loading">Loading…</div>`;
    const r = await call("app-api", { action: "calendar", month: S.calMonth });
    if (!r.ok) { if (r.code !== "logged_out") toast(r.message, true); return; }
    S.cal = r;
  }
  if (S.tab !== "calendar") return;

  const h = S.home, c = S.cal, today = todayIST();
  const usual = Number(c.default_qty);
  const map = new Map(c.changes.map((x) => [x.date, x]));
  const first = d0(S.calMonth + "-01");
  const lead = (first.getUTCDay() + 6) % 7; // Monday first
  const days = new Date(Date.UTC(first.getUTCFullYear(), first.getUTCMonth() + 1, 0)).getUTCDate();
  const title = first.toLocaleDateString("en-IN", { timeZone: "UTC", month: "long", year: "numeric" });

  let cells = ["M", "T", "W", "T", "F", "S", "S"].map((d) => `<div class="wd">${d}</div>`).join("");
  for (let i = 0; i < lead; i++) cells += "<div></div>";
  for (let n = 1; n <= days; n++) {
    const date = `${S.calMonth}-${String(n).padStart(2, "0")}`;
    const ch = map.get(date);
    let cls = "", q = usual;
    if (ch) { q = ch.qty; cls = ch.paused ? "paused" : q > usual ? "extra" : q < usual ? "less" : ""; }
    if (date < today) cls += " past";
    if (date === today) cls += " today";
    const label = ch?.paused ? "Paused" : fmtQty(q);
    cells += `<button class="cd ${cls}" data-date="${date}" aria-label="${esc(longDate(date))}, ${esc(label)}">
      ${n}<span class="q">${ch?.paused ? "–" : esc(+Number(q).toFixed(2))}</span></button>`;
  }

  v.innerHTML = `
    <div class="cal">
      <div class="cal-head">
        <button data-m="-1" aria-label="Previous month">‹</button>
        <b>${esc(title)}</b>
        <button data-m="1" aria-label="Next month">›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend">
        <span><i style="background:var(--milk);border:1.5px solid var(--line)"></i>Usual ${esc(fmtQty(usual))}</span>
        <span><i style="background:var(--butter-soft)"></i>Extra</span>
        <span><i style="background:var(--mist)"></i>Less</span>
        <span><i style="border:2px dashed var(--line)"></i>Paused</span>
      </div>
    </div>
    <p class="muted" style="margin:14px 4px">Tap any day from ${esc(shortDate(h.first_editable_date))} to change it.</p>`;

  v.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => {
    const d = d0(S.calMonth + "-01");
    d.setUTCMonth(d.getUTCMonth() + Number(b.dataset.m));
    S.calMonth = d.toISOString().slice(0, 7);
    renderCalendar();
  });
  v.querySelectorAll("[data-date]").forEach((b) => b.onclick = () => {
    const date = b.dataset.date;
    if (date < h.first_editable_date) return toast(`Changes for ${shortDate(date)} are closed.`);
    const ch = map.get(date);
    openDaySheet(date, ch ? ch.qty : usual, ch ? (ch.paused ? "paused" : "changed") : "normal");
  });
}

async function renderAccount() {
  const v = $("#view");
  if (!S.home) { v.innerHTML = `<div class="loading">Loading…</div>`; if (!(await loadHome())) return; }
  const h = S.home;
  if (S.tab !== "account") return;

  const details = h.is_subscriber ? `
      <div class="kv"><span>Name</span><b>${esc(h.name)}</b></div>
      <div class="kv"><span>Mobile</span><b>+91 ${esc(h.phone)}</b></div>
      <div class="kv"><span>Address</span><b>${esc(h.address)}</b></div>
      <div class="kv"><span>Area</span><b>${esc(h.area)}</b></div>
      <div class="kv"><span>Milk</span><b>${esc(h.milk_type)}</b></div>
      <div class="kv"><span>Usual quantity</span><b>${esc(fmtQty(h.default_qty))} a day</b></div>
      <div class="kv"><span>Rate</span><b>₹${esc(h.rate)} per litre</b></div>
      ${h.delivery_charge ? `<div class="kv"><span>Delivery charge</span><b>₹${esc(h.delivery_charge)} a month</b></div>` : ""}`
    : `
      <div class="kv"><span>Name</span><b>${esc(h.name)}</b></div>
      <div class="kv"><span>Mobile</span><b>+91 ${esc(h.phone)}</b></div>`;

  const pq = h.pending_qty_change;
  v.innerHTML = `
    <h2 style="margin-top:6px">Your details</h2>
    <div class="card">${details}</div>

    ${h.is_subscriber ? `
      <h2>Change your usual quantity</h2>
      <div class="card pad">
        ${pq ? `<div class="pending">Your request for ${esc(fmtQty(pq.new_qty))} a day from ${esc(shortDate(pq.effective_from))} is with RD Dairy.</div>` : ""}
        <div class="stepper">
          <button data-minus aria-label="Less milk">−</button>
          <output aria-live="polite">${esc(fmtQty(h.default_qty))}</output>
          <button data-plus aria-label="More milk">+</button>
        </div>
        <div class="field"><label for="qf">Starting from</label><input id="qf" type="date" min="${h.first_editable_date}" value="${h.first_editable_date}" /></div>
        <button class="btn btn-dark btn-block" style="margin-top:14px" data-req>Send request</button>
        <p class="muted" style="margin:10px 0 0;font-size:14px">RD Dairy confirms the new quantity before it starts.</p>
      </div>` : ""}

    <h2>Help and support</h2>
    <div class="card pad">
      <div class="help">
        <a class="wa" href="https://wa.me/91${esc(String(h.support_phone || "").replace(/\D/g, "").slice(-10))}?text=${encodeURIComponent("Hi RD Dairy, I need help with my account (" + h.phone + ")")}" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2s-1 .2-3.3-.7c-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.9s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.3-.1.6.2.3.8 1.4 1.8 2.2 1.2 1.1 2.2 1.4 2.5 1.6.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.3.1.2.1.7-.1 1.3z"/></svg>
          WhatsApp RD Dairy</a>
        <a href="tel:+91${esc(String(h.support_phone || "").replace(/\D/g, "").slice(-10))}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>Call</a>
        ${h.support_email ? `<a href="mailto:${esc(h.support_email)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>Email</a>` : ""}
      </div>
      <div class="links">
        <a href="https://rddairy.com/privacy.html" target="_blank" rel="noopener">Privacy policy</a>
        <a href="https://rddairy.com/terms.html" target="_blank" rel="noopener">Terms of service</a>
      </div>
    </div>

    <div style="margin-top:28px">
      <button class="btn btn-line btn-block" id="logout">Log out</button>
      <button class="danger-link" id="delacc">Delete my account</button>
    </div>`;
  $("#delacc").onclick = openDeleteSheet;

  if (h.is_subscriber) {
    let q = Number(h.default_qty);
    const out = $("output", v);
    $("[data-minus]", v).onclick = () => { q = Math.max(STEP, +(q - STEP).toFixed(2)); out.textContent = fmtQty(q); };
    $("[data-plus]", v).onclick = () => { q = Math.min(20, +(q + STEP).toFixed(2)); out.textContent = fmtQty(q); };
    $("[data-req]", v).onclick = async (e) => {
      if (q === Number(h.default_qty) && !pq) return toast(`${fmtQty(q)} is already your usual quantity`);
      e.target.disabled = true;
      const r = await call("app-api", { action: "request_qty_change", new_qty: q, effective_from: $("#qf").value });
      e.target.disabled = false;
      if (!r.ok) return toast(r.message, true);
      toast("Request sent to RD Dairy");
      S.home = null; await loadHome(); renderAccount();
    };
  }

  $("#logout").onclick = async () => {
    if (!(await confirmBox("Log out of RD Dairy on this phone? You will need a WhatsApp code to log in again.", "Log out"))) return;
    await call("app-auth", { action: "logout" });
    await signOutLocal();
  };
}

const SH = { catalog: null, cat: "All", sel: {}, cart: [], meta: null };
const prodImg = (p) => PRODUCT_IMAGES[p.id] || p.image || "";
const cartKey = (id, size) => id + "|" + size;
const cartCount = () => SH.cart.reduce((a, c) => a + c.qty, 0);
const cartTotal = () => SH.cart.reduce((a, c) => a + c.price * c.qty, 0);

async function loadCart() {
  try { SH.cart = JSON.parse((await store.get("rd_cart")) || "[]"); } catch { SH.cart = []; }
}
function saveCart() { store.set("rd_cart", JSON.stringify(SH.cart)); updateCartBar(); }
function setQty(p, size, delta) {
  const k = cartKey(p.id, size.label);
  const line = SH.cart.find((c) => cartKey(c.id, c.size) === k);
  if (line) { line.qty = Math.max(0, Math.min(50, line.qty + delta)); if (!line.qty) SH.cart = SH.cart.filter((c) => c !== line); }
  else if (delta > 0) SH.cart.push({ id: p.id, name: p.name, size: size.label, price: Number(size.price), qty: 1 });
  saveCart();
}
function updateCartBar() {
  document.querySelector(".cartbar")?.remove();
  document.body.classList.remove("has-cart");
  if (!S.token || S.tab !== "shop" || !cartCount()) return;
  document.body.classList.add("has-cart");
  const bar = document.createElement("button");
  bar.className = "cartbar";
  bar.innerHTML = `<span>${cartCount()} ${cartCount() === 1 ? "item" : "items"} · <b>${esc(inr(cartTotal()))}</b></span><span>View cart →</span>`;
  bar.onclick = openCartSheet;
  document.body.appendChild(bar);
}

async function renderShop() {
  const v = $("#view");
  if (!SH.catalog) {
    v.innerHTML = `<div class="loading">Loading…</div>`;
    const r = await call("app-api", { action: "shop_catalog" });
    if (!r.ok) { if (r.code !== "logged_out") toast(r.message, true); return; }
    SH.catalog = r.catalog; SH.meta = r;
    // keep cart prices in line with the latest catalog
    SH.cart = SH.cart.filter((c) => {
      const z = SH.catalog.find((p) => p.id === c.id)?.sizes.find((x) => x.label === c.size);
      if (z) c.price = Number(z.price);
      return !!z;
    });
    saveCart();
  }
  if (S.tab !== "shop") return;

  const cats = ["All", ...new Set(SH.catalog.map((p) => p.category))];
  const list = SH.catalog.filter((p) => SH.cat === "All" || p.category === SH.cat);
  v.innerHTML = `
    <div class="shop-head"><h2>Shop</h2><button id="myord">My orders</button></div>
    <div class="cats">${cats.map((c) => `<button class="${c === SH.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div>
    <div class="prods">${list.map((p) => {
      const size = p.sizes.find((z) => z.label === SH.sel[p.id]) || p.sizes[0];
      const inCart = SH.cart.find((c) => cartKey(c.id, c.size) === cartKey(p.id, size.label));
      return `<article class="prod">
        <img src="${esc(prodImg(p))}" alt="${esc(p.name)}" loading="lazy" />
        <div>
          <h3>${esc(p.name)}</h3>
          <p>${esc(p.description)}</p>
          ${p.sizes.length > 1 ? `<div class="sizes">${p.sizes.map((z) => `<button class="${z.label === size.label ? "on" : ""}" data-size="${esc(p.id)}" data-label="${esc(z.label)}">${esc(z.label)}</button>`).join("")}</div>` : `<div class="sizes"><button class="on" disabled>${esc(size.label)}</button></div>`}
          <div class="addrow"><b>${esc(inr(size.price))}</b>
            ${inCart
              ? `<div class="mini-step"><button data-dec="${esc(p.id)}" aria-label="One less">−</button><span>${inCart.qty}</span><button data-inc="${esc(p.id)}" aria-label="One more">+</button></div>`
              : `<button class="addbtn" data-inc="${esc(p.id)}">Add</button>`}
          </div>
        </div>
      </article>`;
    }).join("")}</div>`;

  $("#myord").onclick = openMyOrders;
  v.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { SH.cat = b.dataset.cat; renderShop(); });
  v.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => { SH.sel[b.dataset.size] = b.dataset.label; renderShop(); });
  const pick = (id) => { const p = SH.catalog.find((x) => x.id === id); return [p, p.sizes.find((z) => z.label === SH.sel[id]) || p.sizes[0]]; };
  v.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { const [p, z] = pick(b.dataset.inc); setQty(p, z, 1); renderShop(); });
  v.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => { const [p, z] = pick(b.dataset.dec); setQty(p, z, -1); renderShop(); });
  updateCartBar();
}

function openCartSheet() {
  const meta = SH.meta || {};
  const st = { repeat: false, plan: "daily", weekday: "0", start: addDays(todayIST(), 1), pay: "cod", proof: "" };
  const sheet = openSheet("");
  sheet.classList.add("tall");

  const draw = () => {
    if (!SH.cart.length) { closeSheet(); renderShop(); return; }
    const total = cartTotal();
    sheet.innerHTML = `<div class="grip"></div>
      <h3>Your cart</h3>
      <div>${SH.cart.map((c, i) => `<div class="cline">
        <div><div class="n">${esc(c.name)}</div><div class="z">${esc(c.size)} · ${esc(inr(c.price))} each</div></div>
        <div class="mini-step"><button data-cdec="${i}" aria-label="One less">−</button><span>${c.qty}</span><button data-cinc="${i}" aria-label="One more">+</button></div>
      </div>`).join("")}</div>
      <div class="line total" style="display:flex;justify-content:space-between;padding:14px 0 4px"><span>Total</span><span>${esc(inr(total))}</span></div>

      <h4>How often?</h4>
      <div class="seg"><button data-rep="0" class="${st.repeat ? "" : "on"}">Just once</button><button data-rep="1" class="${st.repeat ? "on" : ""}">Repeat</button></div>
      ${st.repeat ? `
        <div class="field"><label for="plan">Deliver</label>
          <select id="plan">
            <option value="daily" ${st.plan === "daily" ? "selected" : ""}>Every day</option>
            <option value="alternate" ${st.plan === "alternate" ? "selected" : ""}>Alternate days</option>
            <option value="weekly" ${st.plan === "weekly" ? "selected" : ""}>Once a week</option>
            <option value="monthly" ${st.plan === "monthly" ? "selected" : ""}>Once a month</option>
          </select></div>
        ${st.plan === "weekly" ? `<div class="field"><label for="wd">On</label><select id="wd">${["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"].map((d, i) => `<option value="${i}" ${String(i) === st.weekday ? "selected" : ""}>${d}</option>`).join("")}</select></div>` : ""}
        <div class="field"><label for="sd">Starting from</label><input id="sd" type="date" min="${addDays(todayIST(), 1)}" value="${st.start}" /></div>
        <p class="muted" style="font-size:14px;margin:10px 0 0">${meta.is_subscriber ? "Repeat items are added to your monthly bill." : "Pay for repeat items on delivery."} RD Dairy confirms the start date with you.</p>
      ` : ""}

      <h4>Deliver to</h4>
      <textarea id="addr" aria-label="Delivery address">${esc(st.addr ?? meta.address ?? "")}</textarea>

      ${st.repeat ? "" : `
        <h4>Payment</h4>
        <label class="opt ${st.pay === "cod" ? "on" : ""}"><input type="radio" name="pay" value="cod" ${st.pay === "cod" ? "checked" : ""}/><div><b>Cash on delivery</b><span>Pay when your order arrives</span></div></label>
        ${meta.upi_ready ? `<label class="opt ${st.pay === "upi" ? "on" : ""}"><input type="radio" name="pay" value="upi" ${st.pay === "upi" ? "checked" : ""}/><div><b>Pay now with UPI</b><span>GPay, PhonePe or Paytm</span></div></label>` : ""}
        ${meta.is_subscriber ? `<label class="opt ${st.pay === "bill" ? "on" : ""}"><input type="radio" name="pay" value="bill" ${st.pay === "bill" ? "checked" : ""}/><div><b>Add to my monthly bill</b><span>Delivered with your milk</span></div></label>` : ""}
        <div id="upiArea"></div>
      `}
      <div class="stack">
        <button class="btn btn-main btn-block" id="place">${st.repeat ? "Start repeat order" : `Place order · ${esc(inr(total))}`}</button>
        <button class="btn btn-quiet btn-block" data-close>Keep shopping</button>
      </div>`;

    sheet.querySelectorAll("[data-cinc]").forEach((b) => b.onclick = () => { SH.cart[+b.dataset.cinc].qty = Math.min(50, SH.cart[+b.dataset.cinc].qty + 1); saveCart(); keep(); draw(); });
    sheet.querySelectorAll("[data-cdec]").forEach((b) => b.onclick = () => { const c = SH.cart[+b.dataset.cdec]; c.qty -= 1; if (!c.qty) SH.cart.splice(+b.dataset.cdec, 1); saveCart(); keep(); draw(); });
    sheet.querySelectorAll("[data-rep]").forEach((b) => b.onclick = () => { keep(); st.repeat = b.dataset.rep === "1"; draw(); });
    $("#plan", sheet)?.addEventListener("change", (e) => { keep(); st.plan = e.target.value; draw(); });
    $("#wd", sheet)?.addEventListener("change", (e) => { st.weekday = e.target.value; });
    $("#sd", sheet)?.addEventListener("change", (e) => { st.start = e.target.value; });
    sheet.querySelectorAll("input[name=pay]").forEach((r) => r.onchange = () => { keep(); st.pay = r.value; st.proof = ""; draw(); });
    $("[data-close]", sheet).onclick = () => { closeSheet(); renderShop(); };
    if (!st.repeat && st.pay === "upi") drawUpi();
    $("#place", sheet).onclick = place;
  };
  const keep = () => { const a = $("#addr", sheet); if (a) st.addr = a.value; };

  const drawUpi = async () => {
    const area = $("#upiArea", sheet);
    area.innerHTML = `<div class="loading" style="padding:16px 0">Getting payment details…</div>`;
    const r = await call("app-api", { action: "shop_upi", items: SH.cart });
    if (!r.ok) { area.innerHTML = ""; return toast(r.message, true); }
    area.innerHTML = `
      <a class="btn btn-main btn-block" style="margin-top:12px" href="${esc(r.upi_link)}">Pay ${esc(inr(r.amount))} with UPI app</a>
      <div class="upi-box" style="margin-top:10px"><div><span class="muted" style="font-size:14px">UPI ID</span><br><b>${esc(r.upi_id)}</b></div><button data-copy>Copy</button></div>
      <p class="sub" style="margin:4px 0 10px">After paying, add the UPI reference number or a screenshot.</p>
      <div class="utr-row"><input id="sutr" type="text" inputmode="numeric" autocomplete="off" maxlength="16" aria-label="UPI reference number" /><button data-paste>Paste</button></div>
      <div class="or">or</div>
      <div data-proofwrap>${st.proof ? `<div class="proof"><img src="${st.proof}" alt="Payment screenshot" /><span>Screenshot added</span><button data-remove>Remove</button></div>` : `<label class="attach">Attach screenshot<input type="file" accept="image/*" data-file /></label>`}</div>`;
    $("[data-copy]", area).onclick = async () => { try { await navigator.clipboard.writeText(r.upi_id); toast("UPI ID copied"); } catch { toast(r.upi_id); } };
    $("[data-paste]", area).onclick = async () => {
      try { const m = String(await navigator.clipboard.readText()).match(/\d{12}/); if (m) $("#sutr", area).value = m[0]; else toast("Copy the 12 digit reference in your UPI app first", true); }
      catch { toast("Tap and hold the box to paste", true); }
    };
    $("[data-file]", area)?.addEventListener("change", async (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      try { st.proof = await compressImage(f); } catch { return toast("That image could not be opened", true); }
      keep(); draw();
    });
    $("[data-remove]", area)?.addEventListener("click", () => { st.proof = ""; keep(); draw(); });
  };

  const place = async () => {
    keep();
    const btn = $("#place", sheet);
    const payload = { action: "shop_order", items: SH.cart, address: (st.addr || "").trim(), frequency: st.repeat ? st.plan : "once" };
    if (payload.address.length < 6) return toast("Add your delivery address", true);
    if (st.repeat) { payload.weekday = st.weekday; payload.start_date = st.start; }
    else {
      payload.pay = st.pay;
      if (st.pay === "upi") {
        const utr = ($("#sutr", sheet)?.value || "").replace(/\D/g, "");
        if (utr && utr.length !== 12) return toast("The UPI reference number has 12 digits", true);
        if (!utr && !st.proof) return toast("Add the UPI reference number or a screenshot", true);
        payload.utr = utr; payload.image_base64 = st.proof || undefined;
      }
    }
    btn.disabled = true; btn.textContent = "Placing order…";
    const r = await call("app-api", payload);
    if (!r.ok) { btn.disabled = false; draw(); return toast(r.message, true); }
    SH.cart = []; saveCart();
    sheet.innerHTML = `<div class="grip"></div><div class="done-box">
      <div class="tick">✓</div>
      <h3>${r.kind === "repeat" ? "Repeat order sent" : "Order placed"}</h3>
      <p class="sub">${r.kind === "repeat" ? "RD Dairy will confirm your start date on WhatsApp." : `Order ${esc(r.order_id)} · ${esc(inr(r.total))}. We deliver within 2 days.`}</p>
    </div>
    <div class="stack"><button class="btn btn-dark btn-block" data-orders>See my orders</button><button class="btn btn-quiet btn-block" data-close>Done</button></div>`;
    $("[data-orders]", sheet).onclick = openMyOrders;
    $("[data-close]", sheet).onclick = () => { closeSheet(); renderShop(); };
  };

  draw();
}

async function renderBills() {
  const v = $("#view");
  if (!S.home) { v.innerHTML = `<div class="loading">Loading…</div>`; if (!(await loadHome())) return; }
  if (!S.home.is_subscriber) { v.innerHTML = `<div class="empty">Your monthly bills appear here once your milk subscription starts.</div>`; return; }
  v.innerHTML = `<div class="loading">Loading…</div>`;

  const [b, p] = await Promise.all([call("app-api", { action: "bills" }), call("app-api", { action: "payments" })]);
  if (!b.ok || !p.ok) { const r = !b.ok ? b : p; if (r.code !== "logged_out") toast(r.message, true); return; }
  if (S.tab !== "bills") return;
  S.bills = b.bills;

  const due = b.total_due;
  const unpaid = b.bills.filter((x) => x.due > 0).length;
  const payable = b.bills.filter((x) => x.due > 0 && !x.pending);
  const payableAmt = payable.reduce((a, x) => a + x.due, 0);

  v.innerHTML = `
    <section class="due" aria-label="Amount due">
      <div class="lbl">${due > 0 ? "Amount due" : "All bills paid"}</div>
      <div class="amt ${due > 0 ? "" : "zero"}">${esc(inr(due))}</div>
      <p>${due > 0 ? `Across ${unpaid} ${unpaid === 1 ? "bill" : "bills"}. Tap a bill below to see the details.` : "Thank you. Your account is up to date."}</p>
      ${b.pending_amount > 0 ? `<div class="wait-note">${esc(inr(b.pending_amount))} sent. RD Dairy is confirming it.</div>` : ""}
      ${payableAmt > 0 ? `<button class="btn btn-main btn-block" style="margin-top:16px" id="payall">Pay ${esc(inr(payableAmt))}</button>` : ""}
    </section>

    <h2>Bills</h2>
    ${b.bills.length ? `<div class="list">${b.bills.map((x) => `
      <button class="li" data-bill="${esc(x.id)}">
        <div><div class="t">${esc(periodLabel(x.period_start, x.period_end))}</div>
          <div class="s">${x.milk_qty ? esc(fmtQty(x.milk_qty)) + " of milk" : ""}${x.number ? (x.milk_qty ? ", " : "") + "Bill " + esc(x.number) : ""}</div></div>
        <div class="r"><b>${esc(inr(x.total))}</b><br>
          ${x.due <= 0 ? `<span class="pill paid">Paid</span>` : x.pending ? `<span class="pill wait">Being confirmed</span>` : `<span class="pill due-p">${esc(inr(x.due))} due</span>`}</div>
      </button>`).join("")}</div>`
    : `<div class="empty">Your first bill appears here at the end of the month.</div>`}

    <h2>Payments</h2>
    ${p.payments.length ? `<div class="list">${p.payments.map((x) => `
      <div class="li">
        <div><div class="t">${esc(x.date ? fmtDay(x.date, { day: "numeric", month: "short", year: "numeric" }) : "")}</div>
          <div class="s">${esc(modeLabel(x.mode))}${x.bill_period ? " for " + esc(fmtDay(x.bill_period, { month: "long" })) : ""}</div></div>
        <div class="r"><b>${esc(inr(x.amount))}</b></div>
      </div>`).join("")}</div>`
    : `<div class="empty">Payments you make show up here.</div>`}`;

  v.querySelectorAll("[data-bill]").forEach((el) => el.onclick = () => openBillSheet(el.dataset.bill));
  $("#payall")?.addEventListener("click", () => openUpiSheet(payable.map((x) => x.id)));
}

/* ---------- UPI payment with proof ---------- */
function compressImage(file, maxSide = 1400, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * scale);
      cv.height = Math.round(img.height * scale);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("bad image")); };
    img.src = url;
  });
}

async function openUpiSheet(invoiceIds) {
  const sheet = openSheet(`<div class="loading">Loading…</div>`);
  sheet.classList.add("tall");
  const r = await call("app-api", { action: "upi_start", invoice_ids: invoiceIds });
  if (!r.ok) { closeSheet(); if (r.code !== "logged_out") toast(r.message, true); return; }

  sheet.innerHTML = `<div class="grip"></div>
    <h3>Pay ${esc(inr(r.amount))}</h3>
    <p class="sub">To ${esc(r.upi_name)}. The amount and bill number fill in on their own.</p>
    <a class="btn btn-main btn-block" href="${esc(r.upi_link)}" data-open>Pay with GPay, PhonePe or Paytm</a>
    <div class="upi-box" style="margin-top:12px"><div><span class="muted" style="font-size:14px">UPI ID</span><br><b>${esc(r.upi_id)}</b></div><button data-copy>Copy</button></div>

    <h4>After paying</h4>
    <p class="sub" style="margin-bottom:12px">Share the UPI reference number or a screenshot of the payment.</p>
    <label for="utr" style="display:block;font-weight:600;margin-bottom:6px">UPI reference number (12 digits)</label>
    <div class="utr-row">
      <input id="utr" type="text" inputmode="numeric" autocomplete="off" maxlength="16" />
      <button data-paste>Paste</button>
    </div>
    <div class="or">or</div>
    <div data-proofwrap>
      <label class="attach">Attach screenshot<input type="file" accept="image/*" data-file /></label>
    </div>
    <div class="stack">
      <button class="btn btn-dark btn-block" data-send disabled>Send payment details</button>
      <button class="btn btn-quiet btn-block" data-close>Close</button>
    </div>`;

  let imageData = "";
  const utr = $("#utr", sheet), send = $("[data-send]", sheet), wrap = $("[data-proofwrap]", sheet);
  const digits = () => utr.value.replace(/\D/g, "");
  const refresh = () => { send.disabled = !(digits().length === 12 || imageData); };

  utr.addEventListener("input", () => { utr.value = utr.value.replace(/[^\d ]/g, ""); refresh(); });
  $("[data-close]", sheet).onclick = closeSheet;
  $("[data-copy]", sheet).onclick = async () => {
    try { await navigator.clipboard.writeText(r.upi_id); toast("UPI ID copied"); } catch { toast(r.upi_id); }
  };
  $("[data-paste]", sheet).onclick = async () => {
    try {
      const t = await navigator.clipboard.readText();
      const m = String(t).match(/\d{12}/);
      if (m) { utr.value = m[0]; refresh(); } else toast("Copy the 12 digit reference in your UPI app first", true);
    } catch { toast("Tap and hold the box to paste", true); }
  };

  const bindFile = () => {
    $("[data-file]", wrap).onchange = async (e) => {
      const f = e.target.files?.[0];
      if (!f) return;
      try { imageData = await compressImage(f); } catch { return toast("That image could not be opened", true); }
      wrap.innerHTML = `<div class="proof"><img src="${imageData}" alt="Payment screenshot" /><span>Screenshot added</span><button data-remove>Remove</button></div>`;
      $("[data-remove]", wrap).onclick = () => {
        imageData = "";
        wrap.innerHTML = `<label class="attach">Attach screenshot<input type="file" accept="image/*" data-file /></label>`;
        bindFile(); refresh();
      };
      refresh();
    };
  };
  bindFile();

  send.onclick = async () => {
    if (utr.value.trim() && digits().length !== 12) return toast("The UPI reference number has 12 digits", true);
    send.disabled = true; send.textContent = "Sending…";
    const res = await call("app-api", {
      action: "payment_claim",
      invoice_ids: r.invoice_ids,
      utr: digits().length === 12 ? digits() : "",
      image_base64: imageData || undefined,
    });
    if (!res.ok) { send.textContent = "Send payment details"; refresh(); return toast(res.message, true); }
    closeSheet();
    toast("Payment details sent. RD Dairy will confirm shortly.");
    if (S.tab === "bills") renderBills();
  };
}

async function openBillSheet(id) {
  const sheet = openSheet(`<div class="loading">Loading…</div>`);
  sheet.classList.add("tall");
  const r = await call("app-api", { action: "bill_detail", invoice_id: id });
  if (!r.ok) { closeSheet(); if (r.code !== "logged_out") toast(r.message, true); return; }
  const b = r.bill;
  const lines = r.items.length
    ? r.items.map((i) => `<div class="line"><span>${esc(i.description || i.type)}${i.quantity && i.rate ? ` (${esc(+i.quantity.toFixed(2))} × ${esc(inr(i.rate))})` : ""}</span><span>${esc(inr(i.amount))}</span></div>`).join("")
    : `${b.milk_amount ? `<div class="line"><span>Milk${b.milk_qty ? ` (${esc(fmtQty(b.milk_qty))})` : ""}</span><span>${esc(inr(b.milk_amount))}</span></div>` : ""}
       ${b.other_items_amount ? `<div class="line"><span>Other products</span><span>${esc(inr(b.other_items_amount))}</span></div>` : ""}
       ${b.delivery_charge ? `<div class="line"><span>Delivery charge</span><span>${esc(inr(b.delivery_charge))}</span></div>` : ""}
       ${b.discount ? `<div class="line"><span>Discount</span><span>−${esc(inr(b.discount))}</span></div>` : ""}`;

  sheet.innerHTML = `<div class="grip"></div>
    <h3>${esc(periodLabel(b.period_start, b.period_end))}</h3>
    <p class="sub">${b.number ? "Bill " + esc(b.number) : ""}${b.bill_date ? (b.number ? ", " : "") + "dated " + esc(fmtDay(b.bill_date, { day: "numeric", month: "short", year: "numeric" })) : ""}</p>
    <div class="lines">
      ${lines}
      <div class="line total"><span>Total</span><span>${esc(inr(b.total))}</span></div>
    </div>
    <h4>Payments</h4>
    <div class="lines">
      ${r.payments.length ? r.payments.map((p) => `<div class="line"><span>${esc(p.date ? fmtDay(p.date, { day: "numeric", month: "short" }) : "")}, ${esc(modeLabel(p.mode))}</span><span>${esc(inr(p.amount))}</span></div>`).join("")
        : `<div class="line"><span>Payments for this bill show up here</span><span></span></div>`}
      <div class="line total"><span>${b.due > 0 ? "Balance due" : "Fully paid"}</span><span>${esc(inr(b.due))}</span></div>
    </div>
    <div class="stack">
      ${b.due > 0 && (S.bills || []).find((x) => x.id === b.id)?.pending
        ? `<div class="pending" style="margin:0">Your payment for this bill is being confirmed by RD Dairy.</div>`
        : b.due > 0 ? `<button class="btn btn-main btn-block" data-pay>Pay ${esc(inr(b.due))} for this bill</button>` : ""}
      <button class="btn btn-line btn-block" data-close>Close</button>
    </div>`;
  $("[data-close]", sheet).onclick = closeSheet;
  $("[data-pay]", sheet)?.addEventListener("click", () => openUpiSheet([b.id]));
}

function openDeleteSheet() {
  const reasons = ["Moving out of the delivery area", "Stopping milk delivery", "I have another account", "Something else"];
  const sheet = openSheet(`
    <h3>Delete your account?</h3>
    <p class="sub">Your login stops working on every phone straight away. RD Dairy settles any pending bills with you, then removes your details within 30 days. Bills that tax law requires us to keep are retained.</p>
    <div class="reasons">${reasons.map((r, i) => `<label><input type="radio" name="why" value="${esc(r)}" ${i === 0 ? "checked" : ""}/>${esc(r)}</label>`).join("")}</div>
    <div class="stack">
      <button class="btn btn-block" style="background:var(--danger);color:#fff" data-del>Delete my account</button>
      <button class="btn btn-quiet btn-block" data-close>Keep my account</button>
    </div>`);
  $("[data-close]", sheet).onclick = closeSheet;
  $("[data-del]", sheet).onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = "Deleting…";
    const reason = $("input[name=why]:checked", sheet)?.value || "";
    const r = await call("app-api", { action: "delete_account", reason });
    if (!r.ok) { e.target.disabled = false; e.target.textContent = "Delete my account"; return toast(r.message, true); }
    closeSheet();
    await signOutLocal();
    toast("Your account deletion request is with RD Dairy. Thank you for being with us.");
  };
}
