const SH = { catalog: null, cat: "All", sel: {}, cart: [], meta: null };
const prodImg = (p) => PRODUCT_IMAGES[p.id] || p.image || "";
const cartKey = (id, size) => id + "|" + size;
const cartCount = () => SH.cart.reduce((a, c) => a + c.qty, 0);
const cartTotal = () => SH.cart.reduce((a, c) => a + c.price * c.qty, 0);
const itemsLabel = (n) => n === 1 ? t("1 item") : t("{n} items", { n });

async function loadCart() {
  try { SH.cart = JSON.parse((await store.get("rd_cart")) || "[]"); } catch { SH.cart = []; }
}
function saveCart() { store.set("rd_cart", JSON.stringify(SH.cart)); updateCartBar(); }
function setQty(p, size, delta) {
  const k = cartKey(p.id, size.label);
  const line = SH.cart.find((c) => cartKey(c.id, c.size) === k);
  if (line) { line.qty = Math.max(0, Math.min(50, line.qty + delta)); if (!line.qty) SH.cart = SH.cart.filter((c) => c !== line); }
  else if (delta > 0) SH.cart.push({ id: p.id, name: p.name, size: size.label, price: Number(size.price), qty: 1 });
  saveCart();
}
function updateCartBar() {
  document.querySelector(".cartbar")?.remove();
  document.body.classList.remove("has-cart");
  if (!S.token || S.tab !== "shop" || !cartCount()) return;
  document.body.classList.add("has-cart");
  const bar = document.createElement("button");
  bar.className = "cartbar";
  bar.innerHTML = `<span>${esc(itemsLabel(cartCount()))} · <b>${esc(inr(cartTotal()))}</b></span><span>${esc(t("View cart"))} →</span>`;
  bar.onclick = openCartSheet;
  document.body.appendChild(bar);
}

async function renderShop() {
  const v = $("#view");
  if (!SH.catalog) {
    loadingView();
    const r = await call("app-api", { action: "shop_catalog" });
    if (!r.ok) { if (r.code !== "logged_out") toast(r.message, true); return; }
    SH.catalog = r.catalog; SH.meta = r;
    SH.cart = SH.cart.filter((c) => {
      const z = SH.catalog.find((p) => p.id === c.id)?.sizes.find((x) => x.label === c.size);
      if (z) c.price = Number(z.price);
      return !!z;
    });
    saveCart();
  }
  if (S.tab !== "shop") return;

  const cats = ["All", ...new Set(SH.catalog.map((p) => p.category))].filter((c) => c !== "Fresh");
  if (SH.cat === "Fresh") SH.cat = "All";
  const list = SH.catalog.filter((p) => SH.cat === "All" || p.category === SH.cat);
  v.innerHTML = `
    <div class="shop-head"><h2>${esc(t("Shop"))}</h2><button id="myord">${esc(t("My orders"))}</button></div>
    ${SH.meta.gold?.active ? `<div class="goldstrip">✦ ${esc(t("RD Gold: free delivery and {pct}% off", { pct: SH.meta.gold.discount }))}</div>` : ""}
    ${SH.meta.trial ? `<button class="trialcard" data-trial><b>${esc(t("Try 7 days of fresh A2 milk"))}</b><span>${esc(t("{size} every morning for {days} days, just {amt}", { size: SH.meta.trial.size, days: SH.meta.trial.days, amt: inr(SH.meta.trial.price) }))}</span><i>${esc(t("Start trial"))} →</i></button>` : ""}
    <div class="cats">${cats.map((c) => `<button class="${c === SH.cat ? "on" : ""}" data-cat="${esc(c)}">${esc(t(c))}</button>`).join("")}</div>
    <div class="prods">${list.map((p) => {
      const size = p.sizes.find((z) => z.label === SH.sel[p.id]) || p.sizes[0];
      const inCart = SH.cart.find((c) => cartKey(c.id, c.size) === cartKey(p.id, size.label));
      const waiting = (SH.meta.notify_me || []).includes(p.id);
      return `<article class="prod ${p.in_stock ? "" : "oos"}">
        <button class="prod-img" data-open="${esc(p.id)}" aria-label="${esc(p.name)}"><img src="${esc(prodImg(p))}" alt="" loading="lazy" />${p.in_stock ? "" : `<span class="oos-tag">${esc(t("Out of stock"))}</span>`}</button>
        <div>
          <button class="prod-name" data-open="${esc(p.id)}"><h3>${esc(p.name)}</h3></button>
          ${p.rating ? `<div class="stars-s">★ ${esc(p.rating)} <span>(${esc(p.rating_count)})</span></div>` : ""}
          <p>${esc(p.description)}</p>
          ${p.sizes.length > 1 ? `<div class="sizes">${p.sizes.map((z) => `<button class="${z.label === size.label ? "on" : ""}" data-size="${esc(p.id)}" data-label="${esc(z.label)}">${esc(z.label)}</button>`).join("")}</div>` : `<div class="sizes"><button class="on" disabled>${esc(size.label)}</button></div>`}
          <div class="addrow"><b>${esc(inr(size.price))}</b>
            ${!p.in_stock
              ? (waiting ? `<span class="notified">✓ ${esc(t("We'll tell you"))}</span>` : `<button class="notifybtn" data-notify="${esc(p.id)}">🔔 ${esc(t("Notify me"))}</button>`)
              : inCart
              ? `<div class="mini-step"><button data-dec="${esc(p.id)}" aria-label="${esc(t("One less"))}">−</button><span>${inCart.qty}</span><button data-inc="${esc(p.id)}" aria-label="${esc(t("One more"))}">+</button></div>`
              : `<button class="addbtn" data-inc="${esc(p.id)}">${esc(t("Add"))}</button>`}
          </div>
        </div>
      </article>`;
    }).join("")}</div>`;

  $("#myord").onclick = openMyOrders;
  v.querySelectorAll("[data-cat]").forEach((b) => b.onclick = () => { SH.cat = b.dataset.cat; renderShop(); });
  v.querySelectorAll("[data-size]").forEach((b) => b.onclick = () => { SH.sel[b.dataset.size] = b.dataset.label; renderShop(); });
  const pick = (id) => { const p = SH.catalog.find((x) => x.id === id); return [p, p.sizes.find((z) => z.label === SH.sel[id]) || p.sizes[0]]; };
  v.querySelectorAll("[data-inc]").forEach((b) => b.onclick = () => { const [p, z] = pick(b.dataset.inc); setQty(p, z, 1); renderShop(); });
  v.querySelectorAll("[data-dec]").forEach((b) => b.onclick = () => { const [p, z] = pick(b.dataset.dec); setQty(p, z, -1); renderShop(); });
  v.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => openProduct(b.dataset.open));
  $("[data-trial]", v)?.addEventListener("click", openTrialSheet);
  v.querySelectorAll("[data-notify]").forEach((b) => b.onclick = () => notifyMe(b.dataset.notify));
  updateCartBar();
  if (SH.openAfter) { const id = SH.openAfter; SH.openAfter = null; openProduct(id); }
}

async function notifyMe(id) {
  const r = await call("app-api", { action: "notify_me", id });
  if (!r.ok) return toast(r.message, true);
  SH.meta.notify_me = [...new Set([...(SH.meta.notify_me || []), id])];
  toast(t("We'll tell you when it's back in stock"));
  if (S.tab === "shop") renderShop();
  if ($(".pd")) openProduct(id);
}

const starRow = (n, size = "") => `<span class="stars ${size}">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= Math.round(n) ? "on" : ""}">★</i>`).join("")}</span>`;

/* ---------- product detail page ---------- */
async function openProduct(id) {
  const p = SH.catalog.find((x) => x.id === id); if (!p) return;
  const d = p.details || {};
  const photos = [prodImg(p), ...(p.photos || [])];
  let size = p.sizes.find((z) => z.label === SH.sel[p.id]) || p.sizes[0];
  const sheet = openSheet("");
  sheet.classList.add("tall", "pd");
  const draw = (reviews) => {
    const inCart = SH.cart.find((c) => cartKey(c.id, c.size) === cartKey(p.id, size.label));
    const waiting = (SH.meta.notify_me || []).includes(p.id);
    sheet.innerHTML = `<div class="grip"></div>
      <div class="pd-gal">${photos.map((u) => `<img src="${esc(u)}" alt="${esc(p.name)}" />`).join("")}</div>
      ${photos.length > 1 ? `<div class="pd-dots">${photos.map((_, i) => `<i class="${i ? "" : "on"}"></i>`).join("")}</div>` : ""}
      <h3 style="margin-top:12px">${esc(p.name)}</h3>
      ${p.rating ? `<div class="pd-rate">${starRow(p.rating)} <b>${esc(p.rating)}</b> <span class="muted">· ${esc(t("{n} reviews", { n: p.rating_count }))}</span></div>` : ""}
      <p class="sub">${esc(d.about || p.description)}</p>
      ${p.sizes.length > 1 ? `<div class="sizes">${p.sizes.map((z) => `<button class="${z.label === size.label ? "on" : ""}" data-psize="${esc(z.label)}">${esc(z.label)} · ${esc(inr(z.price))}</button>`).join("")}</div>` : ""}
      <div class="pd-buy">
        <b>${esc(inr(size.price))}</b>
        ${!p.in_stock
          ? (waiting ? `<span class="notified">✓ ${esc(t("We'll tell you when it's back in stock"))}</span>` : `<button class="btn btn-main" data-pnotify>🔔 ${esc(t("Notify me"))}</button>`)
          : inCart
          ? `<div class="mini-step big"><button data-pdec aria-label="${esc(t("One less"))}">−</button><span>${inCart.qty}</span><button data-pinc aria-label="${esc(t("One more"))}">+</button></div>`
          : `<button class="btn btn-main" data-pinc>${esc(t("Add to cart"))}</button>`}
      </div>
      ${d.nutrition && d.nutrition.length ? `<h4>${esc(t("Nutrition"))} <span class="muted" style="font-weight:500;font-size:13px">${esc(d.nutrition_basis || "")}</span></h4>
        <div class="nut">${d.nutrition.map((r) => `<div><span>${esc(r[0])}</span><b>${esc(r[1])}</b></div>`).join("")}</div>` : ""}
      ${d.shelf_life || d.storage ? `<h4>${esc(t("Shelf life and storage"))}</h4><p class="sub">${esc([d.shelf_life, d.storage].filter(Boolean).join(". "))}</p>` : ""}
      ${d.how_made ? `<h4>${esc(t("How it's made"))}</h4><p class="sub">${esc(d.how_made)}</p>` : ""}
      <h4>${esc(t("Ratings and reviews"))}</h4>
      <div id="pdRev">${reviews ? "" : loaderHTML()}</div>
      <div class="stack"><button class="btn btn-quiet btn-block" data-close>${esc(t("Close"))}</button></div>`;
    $("[data-close]", sheet).onclick = () => { closeSheet(); if (S.tab === "shop") renderShop(); };
    sheet.querySelectorAll("[data-psize]").forEach((b) => b.onclick = () => { size = p.sizes.find((z) => z.label === b.dataset.psize); SH.sel[p.id] = size.label; draw(reviews); });
    $("[data-pinc]", sheet)?.addEventListener("click", () => { setQty(p, size, 1); draw(reviews); });
    $("[data-pdec]", sheet)?.addEventListener("click", () => { setQty(p, size, -1); draw(reviews); });
    $("[data-pnotify]", sheet)?.addEventListener("click", () => notifyMe(p.id));
    const gal = $(".pd-gal", sheet);
    gal?.addEventListener("scroll", () => { const i = Math.round(gal.scrollLeft / gal.clientWidth); sheet.querySelectorAll(".pd-dots i").forEach((d2, k) => d2.classList.toggle("on", k === i)); });
    if (reviews) drawReviews(reviews);
  };
  const drawReviews = (r) => {
    const box = $("#pdRev", sheet); if (!box) return;
    const st = { rating: r.mine?.rating || 0 };
    box.innerHTML = `
      <div class="rv-write">
        <div class="rv-q">${esc(r.mine ? t("Your review") : t("Tried it? Rate it"))}</div>
        <div class="rv-stars">${[1, 2, 3, 4, 5].map((i) => `<button data-star="${i}" class="${i <= st.rating ? "on" : ""}" aria-label="${i}">★</button>`).join("")}</div>
        <textarea id="rvText" rows="2" placeholder="${esc(t("What did you like?"))}">${esc(r.mine?.comment || "")}</textarea>
        <button class="btn btn-dark btn-block" data-rvsave>${esc(t("Post review"))}</button>
      </div>
      ${r.reviews.filter((x) => !x.mine).map((x) => `<div class="rv">
        <div class="top">${starRow(x.rating, "sm")} <b>${esc(x.name)}</b> <span class="muted">${esc(new Date(x.at).toLocaleDateString(locale(), { day: "numeric", month: "short" }))}</span></div>
        ${x.comment ? `<p>${esc(x.comment)}</p>` : ""}</div>`).join("")}`;
    box.querySelectorAll("[data-star]").forEach((b) => b.onclick = () => { st.rating = +b.dataset.star; box.querySelectorAll("[data-star]").forEach((x) => x.classList.toggle("on", +x.dataset.star <= st.rating)); });
    $("[data-rvsave]", box).onclick = async (e) => {
      if (!st.rating) return toast(t("Choose 1 to 5 stars"), true);
      e.target.disabled = true;
      const res = await call("app-api", { action: "review_save", id: p.id, rating: st.rating, comment: $("#rvText", box).value });
      e.target.disabled = false;
      if (!res.ok) return toast(res.message, true);
      toast(t("Thank you for your review"));
      SH.catalog = null; await renderShop(); openProduct(p.id);
    };
  };
  draw(null);
  const r = await call("app-api", { action: "product_reviews", id: p.id });
  if (r.ok && $(".pd")) draw(r);
}

// shared UTR / screenshot block, used by the shop and bill payments
function proofBlock(area, state, onChange) {
  area.querySelector("[data-proofwrap]").innerHTML = state.proof
    ? `<div class="proof"><img src="${state.proof}" alt="" /><span>${esc(t("Screenshot added"))}</span><button data-remove>${esc(t("Remove"))}</button></div>`
    : `<label class="attach">${esc(t("Attach screenshot"))}<input type="file" accept="image/*" data-file /></label>`;
  area.querySelector("[data-file]")?.addEventListener("change", async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    try { state.proof = await compressImage(f); } catch { return toast(t("That image could not be opened"), true); }
    proofBlock(area, state, onChange); onChange();
  });
  area.querySelector("[data-remove]")?.addEventListener("click", () => { state.proof = ""; proofBlock(area, state, onChange); onChange(); });
}
async function pasteUtrInto(input, after) {
  try {
    const m = String(await navigator.clipboard.readText()).match(/\d{12}/);
    if (m) { input.value = m[0]; after && after(); } else toast(t("Copy the 12 digit reference in your UPI app first"), true);
  } catch { toast(t("Tap and hold the box to paste"), true); }
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast(t("UPI ID copied")); } catch { toast(text); }
}

// Rebuild the cart lines from the order text, let the customer adjust, then save
async function editOrder(o) {
  if (!SH.catalog) { const r = await call("app-api", { action: "shop_catalog" }); if (!r.ok) return toast(r.message, true); SH.catalog = r.catalog; SH.meta = r; }
  const lines = [];
  String(o.items).split(", ").forEach((part) => {
    const m = part.match(/^(.*) (\S.*?) x (\d+)$/);
    if (!m) return;
    for (const p of SH.catalog) for (const z of p.sizes) if (part.startsWith(p.name + " " + z.label + " x ")) lines.push({ id: p.id, name: p.name, size: z.label, price: Number(z.price), qty: Number(part.split(" x ").pop()) });
  });
  const sheet = openSheet("");
  sheet.classList.add("tall");
  const draw = () => {
    const sub = lines.reduce((a, l) => a + l.price * l.qty, 0);
    sheet.innerHTML = `<div class="grip"></div><h3>${esc(t("Change items"))}</h3><p class="sub">${esc(o.order_id)}</p>
      ${lines.map((l, i) => `<div class="cline"><div><div class="n">${esc(l.name)}</div><div class="z">${esc(l.size)} · ${esc(inr(l.price))}</div></div>
        <div class="mini-step"><button data-d="${i}">−</button><span>${l.qty}</span><button data-i="${i}">+</button></div></div>`).join("")}
      <div style="display:flex;justify-content:space-between;padding:14px 0;font-weight:700"><span>${esc(t("Items"))}</span><span>${esc(inr(sub))}</span></div>
      <div class="stack"><button class="btn btn-main btn-block" data-save>${esc(t("Save changes"))}</button><button class="btn btn-quiet btn-block" data-close>${esc(t("Close"))}</button></div>`;
    sheet.querySelectorAll("[data-i]").forEach((b) => b.onclick = () => { lines[+b.dataset.i].qty = Math.min(50, lines[+b.dataset.i].qty + 1); draw(); });
    sheet.querySelectorAll("[data-d]").forEach((b) => b.onclick = () => { lines[+b.dataset.d].qty = Math.max(0, lines[+b.dataset.d].qty - 1); draw(); });
    $("[data-close]", sheet).onclick = openMyOrders;
    $("[data-save]", sheet).onclick = async () => {
      const res = await call("app-api", { action: "order_edit", order_id: o.order_id, items: lines.filter((l) => l.qty > 0) });
      if (!res.ok) return toast(res.message, true);
      toast(t("Order updated")); openMyOrders();
    };
  };
  if (!lines.length) return toast(t("Please chat with us to change this order"), true);
  draw();
}

    <div class="cline2"><span>${esc(t("Delivery fee"))}</span><span>${q.fee ? esc(inr(q.fee)) : `<b class="free">${esc(t("Free"))}</b>`}</span></div>

const THUMB_KEYS = [["pouch", "milk-pouch-goa2-rd-dairy"], ["buffalo", "buffalo-milk"], ["buffalow", "buffalo-milk"], ["ghee", "a2-bilona-cow-ghee"], ["paneer", "rd-dairy-paneer"], ["curd", "rd-dairy-curd"], ["butter", "rd-dairy-butter"], ["milk", "a2-cow-milk"]];
function orderThumbs(text, single) {
  const parts = String(text || "").toLowerCase().split(/,\s*/);
  const ids = [];
  for (const part of parts) {
    const p = (SH.catalog || []).find((x) => part.includes(x.name.toLowerCase()));
    const id = p ? p.id : (THUMB_KEYS.find(([k]) => part.includes(k)) || [])[1];
    if (id && !ids.includes(id)) ids.push(id);
  }
  const imgs = ids.map((id) => PRODUCT_IMAGES[id] || (SH.catalog || []).find((x) => x.id === id)?.image).filter(Boolean).slice(0, single ? 1 : 4);
  if (!imgs.length) return "";
  return single ? `<img class="ot-one" src="${esc(imgs[0])}" alt="" />` : `<div class="othumbs">${imgs.map((u) => `<img src="${esc(u)}" alt="" />`).join("")}</div>`;
}

// Ask why, with quick choices, before cancelling
function askCancelReason(question) {
  return new Promise((resolve) => {
    const reasons = ["Ordered by mistake", "Need it on another day", "Want to change items", "Found it elsewhere", "Something else"];
    const box = document.createElement("div");
    box.className = "confirm-box";
    box.innerHTML = `<div class="inner"><p>${esc(question)}</p>
      <div class="reasons">${reasons.map((r, i) => `<label><input type="radio" name="cr" value="${esc(r)}" ${i === 0 ? "checked" : ""}/>${esc(t(r))}</label>`).join("")}</div>
      <div class="row-actions" style="margin-top:14px"><button class="btn btn-line" data-no>${esc(t("Keep it"))}</button><button class="btn btn-dark" data-yes>${esc(t("Cancel order"))}</button></div></div>`;
    document.body.appendChild(box);
    box.addEventListener("click", (e) => {
      if (e.target.closest("[data-yes]")) { const v = box.querySelector("input[name=cr]:checked")?.value || ""; box.remove(); resolve(v); }
      else if (e.target.closest("[data-no]") || e.target === box) { box.remove(); resolve(null); }
    });
  });
}

    </div>`);
  sheet.classList.add("tall");
  const frame = $(".billframe", sheet), scaler = $(".billscale", sheet);
  const fit = () => {
    const s = Math.min(1, frame.clientWidth / 760);
    scaler.style.transform = `scale(${s})`;
    frame.style.height = Math.ceil(scaler.firstElementChild.offsetHeight * s) + "px";
  };
  requestAnimationFrame(fit);
  $("[data-close]", sheet).onclick = closeSheet;
  $("[data-dl]", sheet).onclick = async (e) => {
    const btn = e.currentTarget, label = btn.textContent;
    btn.disabled = true; btn.textContent = t("Preparing PDF…");
    try { await billDownload(r); } catch (err) { console.error(err); toast(t("RD Dairy server error. Please try again shortly."), true); }
    btn.disabled = false; btn.textContent = label;
  };

async function billDownload(r) {
  if (!window.html2canvas) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js");
  if (!window.jspdf) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
  const holder = document.createElement("div");
  holder.style.cssText = "position:fixed;left:-9999px;top:0;";
  holder.innerHTML = billHTML(r);
  document.body.appendChild(holder);
  try {
    await new Promise((res) => setTimeout(res, 120));
    const canvas = await window.html2canvas(holder.firstElementChild, { scale: 2, backgroundColor: "#ffffff", useCORS: true });
    const { jsPDF } = window.jspdf;
    const w = canvas.width / 2, h = canvas.height / 2;
    const doc = new jsPDF({ unit: "px", format: [w, h], orientation: h > w ? "portrait" : "landscape", hotfixes: ["px_scaling"] });
    doc.addImage(canvas.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, w, h);
    const safe = String(r.customer?.name || "Customer").trim().replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "");
    const name = `${safe}_${r.bill.number || "bill"}.pdf`;
    const P = window.Capacitor?.Plugins;
    if (P?.Filesystem && P?.Share) {
      const data = doc.output("datauristring").split(",")[1];
      const saved = await P.Filesystem.writeFile({ path: name, data, directory: "CACHE" });
      await P.Share.share({ title: name, url: saved.uri });
    } else {
      doc.save(name);
    }
  } finally {
    holder.remove();
  }
}

// One place that understands links from banners and notifications
function openLink(link) {
  link = String(link || "");
  if (!link) return;
  if (/^https?:\/\//.test(link)) { window.open(link, "_blank", "noopener"); return; }
  if (link.startsWith("product:")) { SH.openAfter = link.slice(8); return go("shop"); }
  if (link.startsWith("offer:")) { SH.pendingCode = link.slice(6); toast(t("Code {code} is ready in your cart", { code: SH.pendingCode })); return go("shop"); }
  const map = { shop: () => go("shop"), bills: () => go("bills"), help: () => go("help"), profile: () => go("account"),
    chat: () => { S.chatOpen = true; go("help"); }, wallet: openWalletSheet, gold: openGoldSheet, refer: openReferSheet,
    trial: openTrialSheet, visit: openVisitSheet, home: () => go("home") };
  (map[link] || (() => {}))();
}

const WMO = (c) => c === 0 ? ["☀️", "Clear sky"] : c <= 2 ? ["🌤️", "Partly cloudy"] : c === 3 ? ["☁️", "Cloudy"] : c <= 48 ? ["🌫️", "Misty"] : c <= 67 ? ["🌧️", "Rain"] : c <= 77 ? ["🌨️", "Cold"] : c <= 82 ? ["🌦️", "Showers"] : ["⛈️", "Thunderstorms"];
async function weather(w) {
  try {
    const ll = latLngFromLink(S.home?.map_link) || [w.lat, w.lng];
    const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${ll[0]}&longitude=${ll[1]}&current=temperature_2m,weather_code&daily=temperature_2m_max,precipitation_probability_max&timezone=Asia%2FKolkata&forecast_days=2`);
    const d = await res.json();
    const [ico, word] = WMO(d.current.weather_code);
    const rainTmr = d.daily?.precipitation_probability_max?.[1];
    const el = $("#gWeather"); if (!el) return;
    $("#gIcon").textContent = ico;
    el.textContent = `${Math.round(d.current.temperature_2m)}°C, ${t(word)}${rainTmr >= 50 ? " · " + t("Rain likely tomorrow morning") : ""}`;
  } catch { const el = $("#gWeather"); if (el) el.textContent = t("Fresh milk is on its way"); }
}

/* ---------- stories ---------- */
function openStories(start) {
  const list = S.extras?.stories || []; if (!list.length) return;
  let i = start, timer = 0;
  const v = document.createElement("div");
  v.className = "storyview";
  document.body.appendChild(v);
  const close = () => { clearTimeout(timer); v.remove(); };
  const show = () => {
    clearTimeout(timer);
    const s = list[i];
    v.innerHTML = `<div class="sv-bars">${list.map((_, k) => `<i class="${k < i ? "done" : k === i ? "now" : ""}"><b></b></i>`).join("")}</div>
      <button class="sv-x" aria-label="${esc(t("Close"))}">✕</button>
      ${s.media_type === "video" ? `<video src="${esc(s.media_url)}" autoplay playsinline></video>` : `<img src="${esc(s.media_url)}" alt="" />`}
      <div class="sv-cap">${s.title ? `<b>${esc(s.title)}</b>` : ""}${s.caption ? `<span>${esc(s.caption)}</span>` : ""}</div>
      <button class="sv-prev" aria-label="Previous"></button><button class="sv-next" aria-label="Next"></button>`;
    $(".sv-x", v).onclick = close;
    $(".sv-prev", v).onclick = () => { if (i > 0) { i--; show(); } };
    const next = () => { if (i < list.length - 1) { i++; show(); } else close(); };
    $(".sv-next", v).onclick = next;
    const vid = $("video", v);
    const dur = vid ? 0 : 5000;
    $(".sv-bars .now b", v).style.animationDuration = (dur || 15000) + "ms";
    if (vid) { vid.onloadedmetadata = () => { $(".sv-bars .now b", v).style.animationDuration = vid.duration * 1000 + "ms"; }; vid.onended = next; }
    else timer = setTimeout(next, dur);
  };
  show();
}

const ISSUE_KINDS = [
  ["missed", "Milk not delivered"], ["late", "Delivered late"], ["damaged", "Damaged or leaking"],
  ["wrong_qty", "Wrong quantity"], ["quality", "Quality concern"], ["other", "Something else"],
];

function openIssueSheet() {
  const today = todayIST();
  const st = { kind: "", proof: "" };
  const sheet = openSheet(`
    <h3>${esc(t("Report a delivery problem"))}</h3>
    <div class="field"><label for="idate">${esc(t("Which delivery?"))}</label><input id="idate" type="date" max="${today}" min="${addDays(today, -30)}" value="${today}" /></div>
    <h4>${esc(t("What went wrong?"))}</h4>
    <div class="kinds">${ISSUE_KINDS.map(([k, l]) => `<button data-kind="${k}">${esc(t(l))}</button>`).join("")}</div>
    <div class="field"><label for="inote">${esc(t("Tell us more (optional)"))}</label><textarea id="inote" maxlength="500"></textarea></div>
    <h4>${esc(t("Add a photo (optional)"))}</h4>
    <div data-photowrap></div>
    <div class="stack">
      <button class="btn btn-main btn-block" data-send>${esc(t("Send report"))}</button>
      <button class="btn btn-quiet btn-block" data-close>${esc(t("Close"))}</button>
    </div>`);
  sheet.classList.add("tall");
  sheet.querySelectorAll("[data-kind]").forEach((b) => b.onclick = () => {
    st.kind = b.dataset.kind;
    sheet.querySelectorAll("[data-kind]").forEach((x) => x.classList.toggle("on", x === b));
  });
  const drawPhoto = () => {
    const w = $("[data-photowrap]", sheet);
    w.innerHTML = st.proof
      ? `<div class="proof"><img src="${st.proof}" alt="" /><span>${esc(t("Photo added"))}</span><button data-remove>${esc(t("Remove"))}</button></div>`
      : `<label class="attach">${esc(t("Add a photo (optional)"))}<input type="file" accept="image/*" data-file /></label>`;
    $("[data-file]", w)?.addEventListener("change", async (e) => {
      const f = e.target.files?.[0]; if (!f) return;
      try { st.proof = await compressImage(f); } catch { return toast(t("That image could not be opened"), true); }
      drawPhoto();
    });
    $("[data-remove]", w)?.addEventListener("click", () => { st.proof = ""; drawPhoto(); });
  };
  drawPhoto();
  $("[data-close]", sheet).onclick = closeSheet;
  $("[data-send]", sheet).onclick = async (e) => {
    if (!st.kind) return toast(t("Choose what went wrong"), true);
    e.target.disabled = true; e.target.textContent = t("Sending…");
    const r = await call("app-api", {
      action: "report_issue", date: $("#idate", sheet).value, kind: st.kind,
      note: $("#inote", sheet).value, image_base64: st.proof || undefined,
    });
    if (!r.ok) { e.target.disabled = false; e.target.textContent = t("Send report"); return toast(r.message, true); }
    closeSheet();
    toast(t("Thank you. RD Dairy will look into it today."));
    if (S.tab === "help") loadMyIssues();
  };
}

  const box = $("#acc-issues");

}

const CHAT_TOPICS = [
  ["delivery", "Delivery issue", "🚚"], ["bill", "Bill or payment", "🧾"], ["address", "Change address", "📍"],
  ["milk", "Pause or extra milk", "🥛"], ["product", "Product question", "🧈"], ["other", "Something else", "💬"],
];
const CHAT = { messages: [], status: null, topic: null, local: [], timer: null, proof: "" };

function stopChatPoll() {
  clearInterval(CHAT.timer); CHAT.timer = null;
  if (S.tab !== "help") { S.chatOpen = false; document.body.classList.remove("in-chat"); }
}

async function loadChat() {
  const r = await call("app-api", { action: "chat_list" });
  if (!r.ok) return false;
  const changed = r.messages.length !== CHAT.messages.length;
  CHAT.messages = r.messages; CHAT.status = r.status; CHAT.topic = CHAT.topic || r.topic;
  if (S.home && S.home.chat_unread) { S.home.chat_unread = 0; updateDots(); }
  return changed;
}

async function renderChat() {
  const v = $("#view");
  v.innerHTML = `${loaderHTML()}`;
  await loadChat();
  if (S.tab !== "help" || !S.chatOpen) return;
  const name = (S.home?.name || "").split(" ")[0];
  v.innerHTML = `
    <div class="chat">
      <div class="chat-head">
        <button id="chatback" aria-label="${esc(t("Back"))}">‹</button>
        <div><b>${esc(t("RD Dairy support"))}</b><span>${esc(t("We usually reply within a few minutes, 6 AM to 9 PM."))}</span></div>
      </div>
      <div class="chat-body" id="chatbody"></div>
      <div class="chat-compose">
        <label class="chat-attach" aria-label="${esc(t("Attach a photo"))}">📷<input type="file" accept="image/*" id="chatfile" /></label>
        <div class="chat-in"><div id="chatprev"></div><textarea id="chattext" rows="1" placeholder="${esc(t("Type a message"))}"></textarea></div>
        <button class="chat-send" id="chatsend" aria-label="${esc(t("Send"))}">➤</button>
      </div>
    </div>`;
  document.body.classList.add("in-chat");
  $("#chatback").onclick = () => { S.chatOpen = false; document.body.classList.remove("in-chat"); stopChatPoll(); renderHelp(); };
  const ta = $("#chattext");
  ta.addEventListener("input", () => { ta.style.height = "auto"; ta.style.height = Math.min(120, ta.scrollHeight) + "px"; });
  $("#chatfile").onchange = async (e) => {
    const f = e.target.files?.[0]; if (!f) return;
    try { CHAT.proof = await compressImage(f); } catch { return toast(t("That image could not be opened"), true); }
    $("#chatprev").innerHTML = `<div class="proof"><img src="${CHAT.proof}" alt="" /><span>${esc(t("Photo added"))}</span><button data-rm>${esc(t("Remove"))}</button></div>`;
    $("#chatprev [data-rm]").onclick = () => { CHAT.proof = ""; $("#chatprev").innerHTML = ""; };
  };
  $("#chatsend").onclick = sendChat;
  ta.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey && !/Android|iPhone|iPad/i.test(navigator.userAgent)) { e.preventDefault(); sendChat(); } });
  drawChat(name);
  clearInterval(CHAT.timer);
  CHAT.timer = setInterval(async () => {
    if (S.tab !== "help" || !S.chatOpen || !$("#chatbody")) return stopChatPoll();
    if (await loadChat()) drawChat(name);
  }, 8000);
}

function bubble(m) {
  const mine = m.sender === "customer";
  const time = m.at ? new Date(m.at).toLocaleTimeString(locale(), { hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" }) : "";
  return `<div class="msg ${mine ? "me" : "them"}">
    ${m.image_url ? `<img src="${esc(m.image_url)}" alt="" class="msg-img" />` : ""}
    ${m.body ? `<div>${esc(m.body).replace(/\n/g, "<br>")}</div>` : ""}
    ${time ? `<span class="msg-t">${esc(time)}</span>` : ""}
  </div>`;
}

function drawChat(name) {
  const box = $("#chatbody"); if (!box) return;
  const bot = (text, actions = "") => `<div class="msg them bot"><div>${esc(text)}</div>${actions}</div>`;
  const chips = `<div class="chips">${CHAT_TOPICS.map(([k, l, ic]) => `<button data-topic="${k}" class="${CHAT.topic === l ? "on" : ""}">${ic} ${esc(t(l))}</button>`).join("")}</div>`;
  let html = "";
  if (CHAT.messages.length) {
    html += CHAT.messages.map(bubble).join("");
    if (CHAT.status === "resolved") html += `<div class="chat-note">${esc(t("This chat is marked as resolved. Send a message to reopen it."))}</div>`;
    html += bot(t("Anything else we can help with?")) + chips;
  } else {
    html += bot(t("Hi {name} 👋 How can we help you today?", { name })) + chips;
  }
  html += CHAT.local.join("");
  box.innerHTML = html;
  box.querySelectorAll("[data-topic]").forEach((b) => b.onclick = () => pickTopic(b.dataset.topic, name));
  box.querySelectorAll("[data-act]").forEach((b) => b.onclick = () => chatAction(b.dataset.act));
  box.querySelectorAll(".msg-img").forEach((im) => im.onclick = () => { const sh = openSheet(`<img src="${esc(im.src)}" alt="" style="width:100%;border-radius:14px" /><div class="stack"><button class="btn btn-quiet btn-block" data-close>${esc(t("Close"))}</button></div>`); $("[data-close]", sh).onclick = closeSheet; });
  box.scrollTop = box.scrollHeight;
  window.scrollTo(0, document.body.scrollHeight);
}

function pickTopic(key, name) {
  const [, label] = CHAT_TOPICS.find((x) => x[0] === key);
  CHAT.topic = label;
  const btn = (act, l) => `<button class="msg-act" data-act="${act}">${esc(t(l))}</button>`;
  const replies = {
    delivery: ["Sorry about that. Tell us what went wrong and we will sort it out today.", btn("issue", "Report a delivery problem") + btn("chat", "Chat with us")],
    bill: ["You can see every bill and pay by UPI in Bills. Need more help? Chat with us.", btn("bills", "Open Bills") + btn("chat", "Chat with us")],
    address: ["You can update your address and share your location in Edit my details.", btn("profile", "Edit my details") + btn("chat", "Chat with us")],
    milk: ["You can pause or change milk for any day on Home. Tap the days, then Change.", btn("home", "Go to Home") + btn("chat", "Chat with us")],
    product: ["Type your message below. Our team replies right here.", ""],
    other: ["Type your message below. Our team replies right here.", ""],
  }[key];
  CHAT.local = [`<div class="msg me"><div>${esc(t(label))}</div></div>`, `<div class="msg them bot"><div>${esc(t(replies[0]))}</div>${replies[1] ? `<div class="msg-acts">${replies[1]}</div>` : ""}</div>`];
  drawChat(name);
  if (!replies[1]) $("#chattext")?.focus();
}

function chatAction(act) {
  if (act === "chat") { CHAT.local.push(`<div class="msg them bot"><div>${esc(t("Type your message below. Our team replies right here."))}</div></div>`); drawChat((S.home?.name || "").split(" ")[0]); $("#chattext")?.focus(); }
  if (act === "issue") openIssueSheet();
  if (act === "bills") { S.chatOpen = false; document.body.classList.remove("in-chat"); go("bills"); }
  if (act === "home") { S.chatOpen = false; document.body.classList.remove("in-chat"); go("home"); }
  if (act === "profile") { S.chatOpen = false; document.body.classList.remove("in-chat"); go("account"); setTimeout(openProfileSheet, 400); }
}

async function sendChat() {
  const ta = $("#chattext"), btn = $("#chatsend");
  const text = ta.value.trim();
  if (!text && !CHAT.proof) return;
  btn.disabled = true;
  const r = await call("app-api", { action: "chat_send", body: text, topic: CHAT.topic || "", image_base64: CHAT.proof || undefined });
  btn.disabled = false;
  if (!r.ok) return toast(r.message, true);
  ta.value = ""; ta.style.height = "auto"; CHAT.proof = ""; $("#chatprev").innerHTML = "";
  CHAT.local = [];
  await loadChat();
  drawChat((S.home?.name || "").split(" ")[0]);
}

/* =========================================================
   START
   ========================================================= */
async function startApp() {
  await loadCart();
  shell();
  go("home");
}

(async function init() {
  THEME = (await store.get("rd_theme")) === "dark" ? "dark" : "light"; applyTheme();
  const saved = await store.get("rd_lang");
  const deviceLang = (navigator.language || "en").slice(0, 2);
  await setLang(saved || (["ta", "hi"].includes(deviceLang) ? deviceLang : "en"));
  SPLASH.setHint && SPLASH.setHint(t("Getting your deliveries ready"));
  S.token = await store.get("rd_token");
  if (S.token) {
    // load the home screen data behind the opening animation, then reveal the app
    await Promise.race([Promise.all([loadHome(), loadExtras()]), new Promise((r) => setTimeout(r, 20000))]);
    await startApp();
  } else {
    renderLogin("phone");
  }
  SPLASH.ready();
})();
</script>
