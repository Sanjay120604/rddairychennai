<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Customer Messages | RD Dairy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  :root{--amber:#F5A800;--amber-dark:#C47E00;--amber-light:#FFEAA0;--amber-pale:#FFF8DC;--amber-bg:#FFFBF0;--navy:#1B2A5A;--navy-light:#2D3F7A;--ok:#2e7d32;--warn:#C47E00;--err:#c0392b}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Nunito',sans-serif;color:var(--navy);background:var(--amber-bg);min-height:100vh}
  header{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:#fff;padding:18px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;box-shadow:0 2px 0 var(--amber)}
  header h1{font-family:'Playfair Display',serif;font-size:1.4rem;display:flex;align-items:center;gap:10px}
  header h1 img{width:34px;height:34px;border-radius:9px;object-fit:cover;border:1.5px solid var(--amber)}
  .top-links a{color:var(--amber-light);text-decoration:none;font-weight:700;font-size:.85rem;margin-left:16px}
  .top-links a:hover{color:#fff}
  .wrap{max-width:860px;margin:0 auto;padding:22px}
  .hidden{display:none}

  .gate{max-width:380px;margin:80px auto;background:#fff;border-radius:20px;padding:30px;box-shadow:0 18px 50px rgba(27,42,90,.15);text-align:center}
  .gate h2{font-family:'Playfair Display',serif;margin-bottom:6px}
  .gate p{color:var(--navy-light);font-size:.86rem;margin-bottom:18px}
  .gate input{width:100%;padding:12px 14px;border:1.5px solid var(--amber-light);border-radius:11px;font-family:inherit;font-weight:700;font-size:.95rem;background:var(--amber-bg);margin-bottom:12px;text-align:center}
  .gate input:focus{outline:none;border-color:var(--amber);background:#fff}
  .gate-logo{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--amber);margin:0 auto 14px;box-shadow:0 6px 18px rgba(196,126,0,.25)}
  .gate-logo img{width:100%;height:100%;object-fit:cover}
  .err-msg{color:var(--err);font-weight:700;margin-top:10px;font-size:.85rem}

  .btn{background:var(--amber);color:var(--navy);border:none;border-radius:11px;padding:12px 18px;font-family:inherit;font-weight:800;cursor:pointer;font-size:.92rem;transition:background .2s,transform .15s;text-decoration:none;display:inline-block}
  .btn:hover{background:#ffc62b;transform:translateY(-1px)}
  .btn.full{width:100%}
  .btn.ghost{background:#fff;border:1.5px solid var(--amber-light);color:var(--navy)}
  .btn.ghost:hover{background:var(--amber-bg)}
  .btn.sm{padding:7px 14px;font-size:.8rem;border-radius:9px}
  .btn:disabled{opacity:.6;cursor:default;transform:none}

  .intro{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;margin:6px 0 16px}
  .intro h2{font-family:'Playfair Display',serif;font-size:1.5rem}
  .intro .muted{font-weight:700}
  .muted{color:var(--navy-light);font-size:.84rem}

  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;align-items:center}
  .tab{background:#fff;border:1.5px solid var(--amber-light);color:var(--navy);padding:9px 18px;border-radius:99px;font-weight:800;cursor:pointer;font-size:.88rem;font-family:inherit}
  .tab.active{background:var(--navy);color:#fff;border-color:var(--navy)}
  .tab .n{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:var(--amber);color:var(--navy);font-size:.74rem;line-height:20px}
  .refresh{margin-left:auto}

  .chat{background:#fff;border-radius:16px;padding:18px 20px;box-shadow:0 6px 18px rgba(27,42,90,.07);margin-bottom:14px;border-left:4px solid var(--amber-light)}
  .chat.open{border-left-color:var(--amber)}
  .who{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
  .name{font-family:'Nunito',sans-serif;font-style:normal;font-weight:800;font-size:1.05rem;color:var(--navy)}
  .phone{color:var(--navy-light);font-weight:700;font-size:.84rem;margin-left:6px}
  .pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:.72rem;font-weight:800;margin-left:8px;vertical-align:middle}
  .pill.waiting{background:#fff3e0;color:var(--warn)}
  .pill.done{background:#e8f5e9;color:var(--ok)}
  .when{color:var(--navy-light);font-size:.78rem;font-weight:700}
  .msgs{display:grid;gap:8px;margin:14px 0}
  .msg{background:var(--amber-bg);border:1px solid var(--amber-pale);border-radius:4px 14px 14px 14px;padding:9px 13px;max-width:92%;white-space:pre-wrap;word-break:break-word;font-weight:600;font-size:.92rem}
  .msg a{color:var(--navy-light)}
  .msg time{display:block;font-size:.72rem;color:var(--navy-light);margin-top:3px;font-weight:700}
  .more{background:none;border:none;color:var(--amber-dark);font-family:inherit;font-weight:800;font-size:.8rem;cursor:pointer;padding:0;margin-top:10px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .wa-btn{display:inline-block;background:#25D366;color:#fff;padding:7px 14px;border-radius:9px;font-weight:800;font-size:.8rem;text-decoration:none}
  .wa-btn:hover{background:#1da851}
  .empty{padding:40px;text-align:center;color:var(--navy-light);font-weight:700;background:#fff;border-radius:16px;box-shadow:0 6px 18px rgba(27,42,90,.07)}
  a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
</style>
</head>

      <a href="admin.html">🏠 Admin Dashboard</a>
      <a href="#" id="lockLink">Lock</a>
    </div>
  </header>

  <div class="wrap">
    <div class="intro">
      <h2>WhatsApp inbox</h2>
      <span class="muted" id="summary"></span>
    </div>
    <div class="toolbar">
      <button class="tab active" data-view="open">Waiting<span class="n" id="openCount">0</span></button>
      <button class="tab" data-view="all">All</button>
      <button class="btn ghost sm refresh" id="refreshBtn">↻ Refresh</button>
    </div>
    <div id="list"></div>
  </div>
</div>

<script>
var FN_URL = "https://zfdfsewzcwufhsyhqvnn.supabase.co/functions/v1/wa-webhook";
var INBOX_SESSION = "rd_inbox_key";

var key = sessionStorage.getItem(INBOX_SESSION) || "";
var view = "open";
var messages = [];
var expanded = {};
function $(id){ return document.getElementById(id); }

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function fmt(t){ return new Date(t).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"}); }
function cleanName(n){
  if(!n) return "";
  var s = n.normalize("NFKC").replace(/[\u200B-\u200D\uFE0F]/g,"").trim();
  if(s === s.toUpperCase() && /[A-Z]/.test(s)) s = s.toLowerCase().replace(/(^|\s)\S/g, function(c){ return c.toUpperCase(); });
  return s;
}
function prettyPhone(p){ return (p.indexOf("91")===0 && p.length===12) ? "+91 "+p.slice(2,7)+" "+p.slice(7) : "+"+p; }
function linkify(s){ return esc(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }

async function api(body){
  var res = await fetch(FN_URL,{method:"POST",headers:{"Content-Type":"application/json","x-inbox-key":key},body:JSON.stringify(body)});
  var data = await res.json().catch(function(){ return {}; });
  if(res.status===401) throw new Error("auth");
  if(!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

function showGate(msg){
  $("dash").classList.add("hidden");
  $("gate").classList.remove("hidden");
  var e = $("gateErr");
  if(msg){ e.textContent = msg; e.classList.remove("hidden"); } else e.classList.add("hidden");
  $("inboxKey").value = "";
  $("inboxKey").focus();
}

async function enter(){
  key = $("inboxKey").value.trim();
  if(!key) return;
  $("enterBtn").disabled = true;
  await load(true);
  $("enterBtn").disabled = false;
}

async function load(fromGate){
  try{
    var data = await api({action:"list"});
    messages = data.messages || [];
    sessionStorage.setItem(INBOX_SESSION, key);
    $("gate").classList.add("hidden");
    $("dash").classList.remove("hidden");
    render();
  }catch(e){
    if(e.message==="auth"){ sessionStorage.removeItem(INBOX_SESSION); showGate("Wrong inbox key. Try again."); }
    else if(fromGate || $("dash").classList.contains("hidden")) showGate("Could not reach the inbox. Check your connection and try again.");
  }
}

function groups(){
  var map = {}, order = [];
  messages.forEach(function(m){
    if(!map[m.from_phone]){ map[m.from_phone] = {phone:m.from_phone,name:m.profile_name,items:[],open:false}; order.push(m.from_phone); }
    var g = map[m.from_phone];
    g.items.push(m);
    if(!m.handled) g.open = true;
    if(!g.name && m.profile_name) g.name = m.profile_name;
  });
  return order.map(function(p){ return map[p]; });
}

function render(){
  var all = groups();
  var open = all.filter(function(g){ return g.open; });
  var list = view==="open" ? open : all;

  $("openCount").textContent = open.length;
  $("summary").textContent = open.length
    ? open.length + (open.length>1 ? " customers waiting for a reply" : " customer waiting for a reply")
    : "Every customer has been taken care of";

  document.querySelectorAll(".tab").forEach(function(t){ t.classList.toggle("active", t.dataset.view===view); });

  if(!list.length){
    $("list").innerHTML = '<div class="empty">' + (view==="open" ? "All caught up 🥛 New messages appear here." : "Customer messages appear here as they write in.") + '</div>';
    return;
  }

  $("list").innerHTML = list.map(function(g){
    var show = expanded[g.phone] ? g.items : g.items.slice(0,3);
    var bubbles = show.slice().reverse().map(function(m){
      return '<div class="msg">'+linkify(m.body)+'<time>'+fmt(m.received_at)+'</time></div>';
    }).join("");
    var more = (g.items.length>3 && !expanded[g.phone]) ? '<button class="more" data-more="'+esc(g.phone)+'">Show all '+g.items.length+' messages</button>' : "";
    return '<div class="chat'+(g.open?" open":"")+'">'+
      '<div class="who"><div><span class="name">'+esc(cleanName(g.name)||"Customer")+'</span><span class="phone">'+prettyPhone(g.phone)+'</span>'+
      '<span class="pill '+(g.open?"waiting":"done")+'">'+(g.open?"Waiting":"Done")+'</span></div>'+
      '<span class="when">'+fmt(g.items[0].received_at)+'</span></div>'+
      more+'<div class="msgs">'+bubbles+'</div>'+
      '<div class="actions">'+
        '<a class="wa-btn" href="https://wa.me/'+esc(g.phone)+'" target="_blank" rel="noopener">Reply on WhatsApp</a>'+
        '<button class="btn ghost sm" data-phone="'+esc(g.phone)+'" data-handled="'+g.open+'">'+(g.open?"Mark done":"Reopen")+'</button>'+
      '</div></div>';
  }).join("");
}

$("list").addEventListener("click", async function(e){
  var more = e.target.closest("[data-more]");
  if(more){ expanded[more.dataset.more] = true; render(); return; }
  var b = e.target.closest("[data-phone]");
  if(!b) return;
  var handled = b.dataset.handled==="true";
  b.disabled = true;
  try{
    await api({action:"handled",phone:b.dataset.phone,handled:handled});
    messages.forEach(function(m){ if(m.from_phone===b.dataset.phone) m.handled = handled; });
    render();
  }catch(err){ b.disabled = false; alert("Could not update. Try again."); }
});

document.querySelectorAll(".tab").forEach(function(t){ t.onclick = function(){ view = t.dataset.view; render(); }; });
$("refreshBtn").onclick = function(){ load(false); };
$("enterBtn").onclick = enter;
$("inboxKey").addEventListener("keydown", function(e){ if(e.key==="Enter") enter(); });
$("lockLink").onclick = function(e){ e.preventDefault(); sessionStorage.removeItem(INBOX_SESSION); key=""; showGate(); };

if(key) load(false); else showGate();
setInterval(function(){ if(key && !$("dash").classList.contains("hidden") && document.visibilityState==="visible") load(false); }, 60000);
</script>
